quarkus.application.name=diurnal

# --- i18n ---
# The languages offered by the "Language" Settings preference (net.zodac.diurnal.user.Language) and recognised by
# Language.fromAcceptLanguageHeader for the anonymous "no session yet" pages (login, register, first-run setup,
# error pages). EVERY offered language is region-qualified rather than a mix of bare and region-qualified codes -
# see Language.ENGLISH_GB's Javadoc for why, and Language.BASE_LANGUAGE_FALLBACK for how an offered language's own
# uncarried regions (e.g. a browser sending es-MX or ar-EG) still resolve to that same language rather than
# falling through to the unrelated global default. The offered set changes over time (see .claude/I18N.md) -
# deliberately not enumerated here so this comment never needs editing just because one is added or removed.
# A translated language is added here AND to the Language enum in the same change (Quarkus validates every
# messages_<locale>.properties file's locale is one of quarkus.locales at build time) - keep this property's own
# value in sync with Language's constants; that sync is unavoidable, but nothing ELSE should need to list them.
quarkus.default-locale=en-GB
quarkus.locales=en-GB,en-US,es-ES,ar-SA,ja-JP

# Public source repository, linked from the page footer (version / license / source links).
app.repository.url=https://github.com/zodac/diurnal
# IANA timezone used for all "today" calculations (streaks, since-labels, comparisons).
# Must match TZ in docker-compose.yml.
app.timezone=${TZ:UTC}

# --- Update check ---
# Admin-only footer "newer version available" indicator: ONCE at startup the running version is
# compared against the latest published GitHub release (derived from app.repository.url); the outcome
# is logged (INFO when a newer version exists, DEBUG otherwise) and, if newer, an "Update available"
# link is shown in the footer of the admin pages. The check runs a single time - the footer verdict is
# never refreshed and may go stale over a long uptime. Best-effort: any failure simply shows nothing.
# Set APP_UPDATE_CHECK_ENABLED=false to disable the startup lookup entirely.
app.update-check.enabled=${APP_UPDATE_CHECK_ENABLED:true}
app.update-check.timeout=${APP_UPDATE_CHECK_TIMEOUT:PT3S}

# --- HTTP ---
# Production listens on 8080 inside the container
quarkus.http.port=8080
# Quarkus's own default (10 MiB, confirmed empirically — undocumented as a literal number, only as
# "10240K" in the config reference) sits BELOW transfer/TransferArchive's own MAX_ARCHIVE_BYTES
# (64 MiB, the whole-archive zip-bomb cap): a legitimate export re-imported at 11-64 MiB was being
# rejected by Vert.x's raw body-length check before the app's own request handler — let alone
# TransferArchive's check — ever ran. Raised past that cap (with headroom for a large multi-year
# export's usual overhead) so every upload TransferArchive is willing to accept in the first place can
# actually reach it; TransferArchive's own cap is still what refuses a genuinely oversized/zip-bomb
# archive, with its translated ImportReason.ArchiveTooLarge banner.
#
# A body OVER this bound is refused by Vert.x itself with an empty 413 that no application code sees,
# so nothing server-side can word that refusal. The Settings data card therefore reads this value back
# (http/QuarkusHttpLimitsConfig -> SettingsWebResource -> the file input's data-max-upload-bytes) and
# refuses an oversized file in the browser, before reading it, naming THIS deployment's own limit.
#
# MAX_UPLOAD_SIZE lets a deployment pick its own bound, in Quarkus MemorySize form (binary suffixes:
# 100M, 512K, 1G). It caps EVERY request body, not just an import — do not set it near the size of a
# form post. Setting it below MAX_ARCHIVE_BYTES is allowed and coherent (a smaller host may well want
# that): imports are simply refused earlier, by the card's own banner rather than by TransferArchive.
quarkus.http.limits.max-body-size=${MAX_UPLOAD_SIZE:100M}
# Trust X-Forwarded-Proto / X-Forwarded-Host from the reverse proxy (Traefik) so that
# redirect URIs built by Quarkus (e.g. for OIDC) use https:// and the public hostname.
# SECURITY: only enable this when the container sits behind a trusted reverse proxy that
# strips/sets these headers. If the app is exposed directly, a client can spoof X-Forwarded-*
# (forging the OIDC redirect host and making isSSL() return true — see cookie note below), so
# this defaults to OFF. The reverse-proxy deployment turns it on via TRUST_X_FORWARDED_HEADERS=true
# (set in docker-compose.yml).
quarkus.http.proxy.proxy-address-forwarding=${TRUST_X_FORWARDED_HEADERS:false}
# The app's OWN view of that same trust decision, for the places it inspects a forwarded header by
# hand rather than letting the HTTP layer do it: CsrfProtectionFilter reads this (via AppConfig) to
# decide whether the host it validates a request's Origin against may come from X-Forwarded-Host, or
# only from Host. With the flag off, a directly-exposed deployment ignores a client-supplied
# X-Forwarded-Host rather than letting a request nominate the authority it is then checked against.
# It is a SEPARATE key purely because quarkus.http.* is a Quarkus config root and cannot carry a
# second @ConfigMapping — the SAME env var drives both, so the two can never disagree. Do not set
# TRUST_X_FORWARDED_HEADERS for one without the other.
app.proxy.trust-forwarded-headers=${TRUST_X_FORWARDED_HEADERS:false}

# On-the-wire gzip for the text responses that dominate transfer size — the self-hosted htmx script
# (~50 kB → ~16 kB), the compiled stylesheet (~47 kB → ~8 kB), the SVG wordmarks (the login-page
# hero wordmark-readme.svg — whose embedded tagline font is subset to its ~15 glyphs, ~5.5 kB on
# disk → ~4 kB gzipped, served to every unauthenticated visitor), and every dynamic HTML response — full
# pages are `no-store`, so they are re-downloaded on every navigation (including a Back), and the HTMX
# partials (day panel ~12 kB → ~1.4 kB) ride the same rule. The woff2 fonts / raster icons are already compressed formats and stay off the list.
#
# BREACH note — why text/html is safe to compress here, and application/json is NOT on the list:
# a BREACH oracle needs (a) a compressed response that (b) reflects attacker-controlled input
# alongside (c) a secret in the same body. For this app's HTML, (b) and (c) are both absent:
#   - the session cookie is SameSite=strict, so an attacker cannot force authenticated cross-site
#     requests at all — the "forced request" primitive BREACH relies on never carries a session;
#   - no HTML body ever contains a secret: CSRF protection is request-origin validation (no tokens
#     in markup) and the opaque session token exists only in the cookie / Authorization header.
# application/json stays OFF the global list because /api/v1/auth/login and /api/v1/auth/register DO
# return the session token in their bodies; the three secret-free hot-path JSON feeds — the month
# back-fill (LogWebResource.monthPanels) and the calendar event feeds (CalendarResource) — opt in
# individually via @Compressed (each carries its own justification in Javadoc).
# --- CORS (browser-based integrations) ---
# The CORS filter is compiled in (build-time flag) but allows NO cross-origin browser callers until
# CORS_ALLOWED_ORIGINS is set (runtime, comma-separated origins) — so the default deployment behaves
# exactly as before. Only needed for third-party web apps running in a BROWSER on another origin;
# mobile apps, servers and scripts are never subject to CORS. Credentials stay off: cross-origin
# callers authenticate with a Bearer token (a plain header), never the session cookie.
quarkus.http.cors.enabled=true
quarkus.http.cors.origins=${CORS_ALLOWED_ORIGINS:}

quarkus.http.enable-compression=true
quarkus.http.compress-media-types=text/css,text/javascript,image/svg+xml,text/html

# --- Database ---
quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=${DB_USER:diurnal_user}
quarkus.datasource.password=${DB_PASSWORD:diurnal_password}
quarkus.datasource.jdbc.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:diurnal_db}
# Keep a couple of warm connections ready; cap at 10 (PostgreSQL default_connection limit is usually 100).
# --- Blocking worker pool ---
# Quarkus defaults this to 200. Every concurrent password hash holds ~19 MiB of live heap (see the
# Argon2id block below), so the default lets a login burst reserve far more heap than the container
# is given. 32 is generous for the deployment size this is tuned for and bounds the worst case to
# well inside the heap; raise it alongside the container's memory if the user count grows (README's
# Performance tuning section carries the per-tier figures).
quarkus.thread-pool.max-threads=${WORKER_MAX_THREADS:32}

quarkus.datasource.jdbc.min-size=2
quarkus.datasource.jdbc.initial-size=2
quarkus.datasource.jdbc.max-size=10
# Validate on borrow so stale connections (e.g. after a DB restart) are replaced before reaching the app.
quarkus.datasource.jdbc.validate-on-borrow=true
quarkus.datasource.jdbc.background-validation-interval=5M
# Fail fast if the pool is exhausted rather than queuing forever.
quarkus.datasource.jdbc.acquisition-timeout=30
# Log a warning for connections held longer than 2 minutes — likely a leak.
quarkus.datasource.jdbc.leak-detection-interval=2M

# Per-profile datasource (and other) overrides live in application-dev.properties /
# application-test.properties — both point at the docker-compose.dev.yml "diurnal-db-dev" service (5432,
# database "diurnal_db").

# --- Flyway ---
quarkus.flyway.migrate-at-start=true
# Migrations are keyed by database vendor: the scripts for PostgreSQL live in db/migration/postgresql, so
# a future second vendor adds its own sibling directory rather than editing (or branching inside) these.
# The location expands from the db-kind above, so the datasource and the migrations can never disagree.
# Flyway's schema history records a script by its name relative to the location root, not by its full path,
# so introducing this directory left every applied migration's recorded name and checksum untouched.
quarkus.flyway.locations=classpath:db/migration/${quarkus.datasource.db-kind}

# --- Hibernate ---
quarkus.hibernate-orm.schema-management.strategy=none
# Use Hibernate's own (default Jackson) formatting for jsonb columns (e.g. User.stats_fields) rather
# than the REST-endpoint JSON facilities, which may be customised. This is the recommended setting and
# becomes the Quarkus default in a future release. See User.statsFields (@JdbcTypeCode SqlTypes.JSON).
quarkus.hibernate-orm.mapping.format.global=ignore

# --- Authentication switches ---
# Set PASSWORD_AUTH_ENABLED=false to disable the login form and rely on OIDC only.
# At least one of password or OIDC must be enabled; the app refuses to start otherwise.
password.auth.enabled=${PASSWORD_AUTH_ENABLED:true}
# Equalise login response time across existent and non-existent accounts. When true (default), a login
# for an email with no stored password hash still runs an Argon2id verification against a throwaway hash,
# so an attacker cannot enumerate which emails have accounts by timing the response. Set
# PASSWORD_AUTH_UNIFORM_TIMING=false to skip that work (faster, but leaks account existence via timing).
password.auth.uniform-timing.enabled=${PASSWORD_AUTH_UNIFORM_TIMING:true}

# --- Password hashing (Argon2id) ---
# Passwords are stored as Argon2id hashes (memory-hard, GPU/ASIC-resistant). Tune the three cost
# parameters so a single hash takes roughly 100-500ms on THIS deployment's hardware — slow enough to
# frustrate offline cracking of a leaked hash, fast enough not to hurt logins. Raise memory first.
# Any increase is applied to each account transparently on its next successful login (the verified
# weaker hash is re-hashed at the new cost). Defaults: 96 MiB, 3 iterations, 4 lanes — measured at
# ~130ms on an 8-core AMD Ryzen 7 5700X; re-measure and adjust on other hardware.
# The key every user's notes data key is wrapped with. Notes are encrypted at rest, and this is the ONLY
# thing that opens them - it deliberately does NOT live in the database, so a dump, backup or replica
# carries sealed notes and wrapped keys and opens neither. Reading a note takes the database AND this
# value, which are lost to different accidents.
#
# LOSING THIS LOSES EVERY NOTE. There is no second copy and no recovery. Keep it wherever DB_PASSWORD is
# kept, and make sure it survives a container rebuild. Generate one with: openssl rand -base64 32
#
# It does NOT hide notes from an administrator who has the running server - they have this file too. That
# is the deliberate limit; see NOTES.md.
notes.encryption.key=${NOTE_ENCRYPTION_KEY:}

# Keys this deployment used previously - the mechanism for ROTATING the one above. Rotation cannot be a
# button in the UI, because the key lives here and the app cannot write its own configuration; so it is
# driven from here too. Set notes.encryption.key to the new value, move the old one into this list, and
# deploy: at startup every stored data key that no longer opens under the new key is opened with one of
# these and re-wrapped, then this can be emptied again at leisure. Doing nothing is safe, and a boot with
# nothing to rotate changes nothing. Comma-separated, so two rotations close together cannot strand an
# account that missed the first. NOT A SECOND KEY TO KEEP: it only exists during a rotation.
notes.encryption.previous-keys=${NOTE_ENCRYPTION_PREVIOUS_KEYS:}

# The longest note a user may save, in characters (code points, so an emoji costs what it costs - see
# TEXT_INPUT.md). Default 10,000, roughly four pages of prose.
#
# THIS BOUNDS NO COLUMN. A note is stored encrypted in an unbounded bytea, so changing this needs no
# migration and no restart beyond the one that reads it. What it really sizes is the bulk paths: the
# dashboard warms three months of note CONTENT in one response (92 notes), the public range feed returns
# 31 per page, and a search opens the whole journal to match on the plaintext - each scales with this
# value. That is why the accepted range stops at 100,000 and the app refuses to boot outside it.
#
# LOWERING IT KEEPS EXISTING NOTES. Nothing re-validates what is already stored, so longer notes stay
# readable, searchable and exportable, and the note box shows them in full. They cannot be SAVED again
# until edited down, and an export containing one cannot be re-imported. See NOTES.md.
notes.max-length=${NOTE_MAX_LENGTH:10000}

# --- Data export/import ---
# Whether each CSV member of an exported archive leads with a UTF-8 byte-order mark. It exists for one
# spreadsheet and costs another, and nothing server-side can tell which one opens the download:
#   true  - Excel on Windows opens the file as UTF-8, so accented characters and emoji survive a
#           double-click. LibreOffice consumes the mark too, but only when its Text Import dialog is
#           set to Unicode (UTF-8); with any other character set it shows the mark as a stray
#           character in the first header cell.
#   false - plain UTF-8, clean in LibreOffice and in every text tool (cat, git diff, awk). Excel on
#           Windows then reads the file in the system code page and mangles anything non-ASCII unless
#           it is brought in through the Text Import wizard.
#
# WRITE SIDE ONLY: the importer strips a leading BOM whatever this says, so an archive exported under
# either setting - or one an editor has since added its own to - imports identically. It is therefore
# safe to change at any time, and is not a format version. See TRANSFER.md.
transfer.csv-bom=${EXPORT_CSV_BOM:true}

# --- Argon2id password hashing cost ---
# OWASP's primary Argon2id recommendation (19 MiB, t=2, p=1), measured at ~54 ms per hash on the
# reference host. These are also the application's dominant heap inputs, because password4j hashes
# in pure Java: the memory cost is a long[][] on the Java HEAP, not native memory. Each distinct
# parameter set RETAINS its memory-kib for the life of the process (password4j caches every
# Argon2Function in a static map and never evicts it), and each hash TRANSIENTLY allocates roughly
# memory-kib x (2 x iterations + 1) - 97 MiB here, against 685 MiB at the former 96 MiB/t=3 default.
# Raising either value therefore costs heap as well as latency; size the container alongside it (see
# the Performance tuning section of README.md). Argon2Config's Javadoc carries the full rationale.
password.hash.argon2.memory-kib=${PASSWORD_HASH_ARGON2_MEMORY_KIB:19456}
password.hash.argon2.iterations=${PASSWORD_HASH_ARGON2_ITERATIONS:2}
password.hash.argon2.parallelism=${PASSWORD_HASH_ARGON2_PARALLELISM:1}
# Set ENABLE_REGISTRATION=false to prevent new password accounts being created via the UI.
# OIDC accounts are always provisioned automatically on first login regardless of this setting.
registration.enabled=${ENABLE_REGISTRATION:true}

# --- Global per-IP auth lockout (login + registration) ---
# ONE counter per client IP tallies both failed logins and failed registrations together; after
# AUTH_IP_THROTTLE_MAX_ATTEMPTS failures within the window that IP is locked out of BOTH logging in and
# registering for AUTH_IP_THROTTLE_LOCKOUT_DURATION. The API returns 429 (+Retry-After) and the forms show
# a lockout banner. There is deliberately NO per-account (email) lockout: keying on the email would let an
# attacker deny service to a chosen victim by failing their logins, so the lockout is keyed purely on the
# client IP. A success never resets the counter (so a valid login/registration can't launder an IP's
# budget); it decays on its own after a quiet window. The client IP is taken from remoteAddress(), which
# honours TRUST_X_FORWARDED_HEADERS, so this is only meaningful behind a trusted proxy. State is in-memory
# (resets on restart, not shared across instances). Set AUTH_IP_THROTTLE_ENABLED=false to disable.
auth.ip-throttle.enabled=${AUTH_IP_THROTTLE_ENABLED:true}
auth.ip-throttle.max-attempts=${AUTH_IP_THROTTLE_MAX_ATTEMPTS:15}
# ISO-8601 duration, e.g. PT15M (15 minutes), PT30S, PT1H.
auth.ip-throttle.lockout-duration=${AUTH_IP_THROTTLE_LOCKOUT_DURATION:PT15M}

# Lazy (non-proactive) authentication: a request is only authenticated when the target endpoint
# actually requires it. This is REQUIRED for the form + OIDC combination below: protected UI pages
# must accept EITHER a diurnal_session (form) OR a q_session (OIDC) cookie, so they must not be pinned
# to a single auth-mechanism. A path pinned to one mechanism only authenticates with that mechanism
# — pinning the ui paths to "form" (a previous revision did this) meant the OIDC session cookie was
# never honoured on /. So an OIDC user was bounced back to /login after a successful login at the IdP.
quarkus.http.auth.proactive=false

# Per-surface authentication. All non-pinned paths are authenticated by SessionAuthMechanism, which
# resolves the opaque server-side session token from either the diurnal_session cookie (web UI) or an
# Authorization: Bearer header (REST API). A permission's auth-mechanism restricts BOTH which
# mechanism may authenticate a matching request AND which one challenges an anonymous one, so we pin
# only the surface that must be exclusive:
#
#   - OIDC trigger (/oidc-login) + callback (/oauth2/callback/oidc) -> code flow only, so an
#     anonymous hit on /oidc-login redirects to the IdP and the IdP's redirect back is processed.
#
# The web UI is deliberately NOT pinned: the session cookie (diurnal_session) or, during the OIDC
# handshake, the code mechanism must be able to authenticate there. Anonymous UI requests are steered
# to /login by SessionAuthMechanism (see its Javadoc), not by pinning. @RolesAllowed on each endpoint
# enforces the user role is valid.
#
# The REST API (/api/*) is likewise NOT pinned. It authenticates with the same opaque session token
# sent as a Bearer header (from POST /api/v1/auth/login), or the web session cookie for a browser reusing
# an existing session. Anonymous /api/* requests get a plain 401 (not the browser /login redirect) —
# see SessionAuthMechanism.challengeFor.
#
# HTTP Basic is deliberately NOT enabled: it would run Argon2id (memory-hard, ~100-500ms) on EVERY
# /api/* request carrying an 'Authorization: Basic' header, making the API both an unthrottled
# password-guessing surface and a cheap CPU/memory-exhaustion lever. Session-token resolution is a cheap
# hashed-index lookup (no per-request password hashing), so the API relies on it exclusively.
quarkus.http.auth.permission.api.paths=/api/*
quarkus.http.auth.permission.api.policy=permit

quarkus.http.auth.permission.oidc-trigger.paths=/oidc-login,/oauth2/callback/oidc
quarkus.http.auth.permission.oidc-trigger.policy=authenticated
quarkus.http.auth.permission.oidc-trigger.auth-mechanism=code

# Public auth surface: the login form POST (handled by WebResource.doLogin), registration, logout and
# the first-run setup landing page (/welcome). Permitted (no auth needed to reach them) and NOT pinned,
# since WebResource now owns POST /login directly.
quarkus.http.auth.permission.form.paths=/login*,/register*,/logout*,/welcome*
quarkus.http.auth.permission.form.policy=permit

# Protected application pages. NOT pinned: the diurnal_session (session) cookie OR a q_session (OIDC)
# cookie may authenticate them — @RolesAllowed on each endpoint triggers lazy auth. Anonymous requests
# are redirected to /login by SessionAuthMechanism, a custom HttpAuthenticationMechanism that outranks
# the OIDC mechanism (default priority 1000) so browsers get the login page instead of a 401.
quarkus.http.auth.permission.ui.paths=/,/settings*,/actions*,/logs*,/stats*
quarkus.http.auth.permission.ui.policy=permit

# Admin pages: same permit pattern as ui — @RolesAllowed("admin") on every AdminWebResource method
# enforces the role check. A named HTTP roles-allowed policy interacts poorly with proactive=false
# (the lazy identity isn't loaded when the HTTP layer checks, so it can silently pass or block both
# admins and non-admins). SessionAuthMechanism handles unauthenticated redirects.
quarkus.http.auth.permission.admin-ui.paths=/admin*
quarkus.http.auth.permission.admin-ui.policy=permit

# Web-UI session cookie (diurnal_session) is now issued by WebResource.doLogin, not Quarkus form auth:
# it is a random opaque token (a handle into the `sessions` table), set HttpOnly + SameSite=Strict, with
# Secure derived from the request scheme (isSSL(), honouring X-Forwarded-Proto behind the proxy) and a
# max-age matching session.absolute-timeout. Lifetimes and the cookie name live in the `session.*`
# block below; there is no encrypted-cookie key to configure (the token carries no state to encrypt).

# --- Sessions (server-side session store) ---
# Both the web UI cookie and the REST API Bearer token are opaque handles into the `sessions` table,
# so they are revocable (logout, password change, "log out everywhere"). A session is valid until
# either bound is crossed. Durations are ISO-8601 (e.g. P30D, P7D, PT12H).
session.idle-timeout=${SESSION_IDLE_TIMEOUT:P30D}
session.absolute-timeout=${SESSION_ABSOLUTE_LIFETIME:P90D}
# How often the SessionSweeper deletes absolute-expired rows.
session.cleanup-interval=${SESSION_CLEANUP_INTERVAL:PT1H}
session.cookie-name=diurnal_session

# --- OpenAPI / Swagger UI ---
# Interactive API documentation for the REST surface (/api/*). Served in ALL profiles (Quarkus only
# bundles Swagger UI in dev by default, hence always-include) at /api, so the docs sit at the root of
# the API namespace they document. This does NOT clash with the JAX-RS endpoints under /api/* (e.g.
# /api/v1/auth/login): the Swagger UI handler serves its own asset paths, the REST resources keep theirs.
# /api is covered by the "api" permission block above (policy=permit), so at the HTTP-permission
# layer the docs are unpinned; OpenApiDocsAuthFilter (a low-order Vert.x route) then gates BOTH the
# Swagger UI shell (/api) and the OpenAPI document (/q/openapi) behind the admin role, so the API
# surface is not anonymously enumerable. The documented endpoints still enforce their own auth too.
quarkus.swagger-ui.always-include=true
quarkus.swagger-ui.path=/api
# Collapse every tag group (Actions/Admin/Auth/Logs/Stats/Users) by default rather than expanding each
# tag's operation list. "list" (Swagger UI's default) shows every PATCH/GET/etc under each tag on load;
# "none" leaves the tag headers collapsed so the reader opens only the group they care about.
quarkus.swagger-ui.doc-expansion=none
# Disable Swagger UI's spec "validator badge". By default, it renders an <img> from the public
# validator.swagger.io with our spec URL — but /q/openapi isn't publicly reachable, so the badge
# always comes back as a broken "invalid" icon at the foot of the docs. Turn it off entirely.
quarkus.swagger-ui.validator-url=none
# Swagger UI ships ~2 MB of static assets (the bundle JS, presets, CSS, fonts/images) that never change
# for a given build, but are served with no cache headers. So the embedded docs re-download the whole
# amount on every visit (the ~1-2s load). Attach a long-lived Cache-Control to just those static assets so
# the browser reuses them after the first load. The regex matches by file extension, so it never touches
# the JSON REST endpoints under the same /api/* namespace (e.g. /api/v1/auth/login — no extension) nor the
# Swagger index HTML / the /q/openapi document (which can change between deployments).
quarkus.http.filter.swagger-ui-assets.matches=/api/.+\\.(js|css|png|gif|svg|ico|woff2?|ttf|eot|map)
quarkus.http.filter.swagger-ui-assets.header.Cache-Control=public, max-age=86400
quarkus.http.filter.swagger-ui-assets.methods=GET,HEAD
# Content-hashed static assets — ONE immutable rule for every asset the build fingerprints
# (scripts/hash-static-assets.sh): the compiled stylesheet (/css/app.<hash>.css), every script
# (/js/*.<hash>.js), the settings preview thumbnails (/img/settings/*.<hash>.webp) and the top-level
# vector marks (/img/<mark>.<hash>.svg). Each carries a content hash in its filename, so a new build
# yields a fresh URL only when the bytes change and the file at any given URL never changes. We cache it for a
# year as `immutable` so browsers and reverse proxies/CDNs skip even a revalidation request. The `\.svg`
# / settings sub-path anchors keep this disjoint from the un-hashed raster icons handled by app-static
# below (all /img/*.png), so the two never fight over the Cache-Control header. Dev (and any non-Docker
# mvn package) serves the un-hashed names, overridden to `no-store` (application-dev.properties).
quarkus.http.filter.app-immutable.matches=/(css/.+|js/.+|img/settings/.+|img/[^/]+\\.svg)
quarkus.http.filter.app-immutable.header.Cache-Control=public, max-age=31536000, immutable
quarkus.http.filter.app-immutable.methods=GET,HEAD
# Stable-URL static assets — the ones that CANNOT be content-hashed, so they can't be `immutable` (a
# redeployment reuses the same URL): the woff2 fonts (referenced by @font-face inside the compiled CSS),
# the raster app-icons (/img/*.png — icon-192/512 are pinned by manifest.json), /favicon.ico (browsers
# probe that fixed root path) and /manifest.json itself. They keep a bounded 7-day ceiling — long enough
# to cut revalidation traffic on assets that change only on a re-brand, short enough to bound how long a
# changed one is served stale. Disjoint from app-immutable above (that owns /img/*.svg + /img/settings/).
quarkus.http.filter.app-static.matches=/(fonts/.+|img/[^/]+\\.png|favicon\\.ico|manifest\\.json)
quarkus.http.filter.app-static.header.Cache-Control=public, max-age=604800
quarkus.http.filter.app-static.methods=GET,HEAD
# HTML PAGES are dynamic and must always reflect the current deploy — most importantly, they carry
# the hashed /css/ URL, so a stale page would point a client at a stale stylesheet. They are marked
# `no-store`, NOT `no-cache`, and the difference is load-bearing: `no-cache` still lets the browser
# STORE the response, and a HISTORY navigation (Back/Forward) deliberately SKIPS revalidation —
# Chrome and Firefox both re-serve a stored `no-cache` page straight from the disk cache with no
# request at all. That is not a proxy-tuning subtlety, it is two user-visible bugs:
#   - a preference saved on /settings, or an action/log/note written on any page, is gone the moment
#     the user navigates away and presses Back: the browser paints the body captured BEFORE the
#     write, so the UI contradicts a database that was updated correctly;
#   - pressing Back after signing out re-renders the whole signed-in page — display name,
#     preferences, journal — from the cache, with no session and no server round-trip to stop it.
# `no-store` is the only directive that closes both: nothing is stored, so every history navigation
# is a real request. It also opts the page out of the back/forward cache (an in-memory snapshot of
# the live DOM, which `no-cache` does NOT disable), which is the point — for a page whose whole
# content is per-user data, "instant Back" is worth nothing if what it shows is wrong.
# The negative lookahead excludes the fingerprinted/long-cached static assets and the API/framework
# namespaces handled above, plus the /internal/ fragments handled by the filter below; everything
# else (/, /login, /settings, /actions, …) is a page the user can navigate back to.
quarkus.http.filter.html-pages.matches=/(?!css/|js/|img/|fonts/|api/|q/|internal/|favicon\\.ico|manifest\\.json).*
quarkus.http.filter.html-pages.header.Cache-Control=no-store
# The logged-OUT pages (login, register, the first-run setup wizard, the error pages) pick their language by
# CONTENT NEGOTIATION on Accept-Language - see user/Language#fromAcceptLanguageHeader - so two clients can be
# served genuinely different bodies for the same URL. Vary states that, which is what stops a shared cache from
# handing a stored Spanish /login to an Arabic-speaking client. `no-store` above already stops any cache keeping
# the page at all, so this is belt-and-braces rather than a live bug, but it is the correct declaration for a
# negotiated response and costs one header. Set for every HTML path rather than just the logged-out ones: a
# signed-in page ignores the header entirely, so declaring the dependency there is merely redundant, never wrong.
quarkus.http.filter.html-pages.header.Vary=Accept-Language
quarkus.http.filter.html-pages.methods=GET,HEAD
# HTMX FRAGMENTS (/internal/*) keep `no-cache` rather than following the pages above into `no-store`.
# They are never a history destination — no Back button ever lands on one — so the staleness the
# pages had to defend against cannot arise, and several of them are validated reads that depend on
# being stored: the dashboard's month feed and the notes range feed attach an ETag (http/EntityTags)
# precisely so a re-visit costs a bodiless 304. `no-store` would delete that optimisation by
# stopping the browser from keeping anything to revalidate against.
quarkus.http.filter.html-fragments.matches=/internal/.*
quarkus.http.filter.html-fragments.header.Cache-Control=no-cache
quarkus.http.filter.html-fragments.header.Vary=Accept-Language
quarkus.http.filter.html-fragments.methods=GET,HEAD
# The OpenAPI document Swagger UI renders stays at the framework path /q/openapi.
# Limit the document to the public API (the versioned /api/v1/* namespace): PublicApiFilter strips the
# web UI's HTML page routes and the /internal/* HTMX partial routes that SmallRye would otherwise scan
# in (they return text/html, not JSON). OpenApiSurfaceIT pins the resulting document to the exact
# endpoint contract, so an accidental addition or leak fails CI.
mp.openapi.filter=net.zodac.diurnal.openapi.PublicApiFilter
# The spec is deliberately NOT exported to a committed file (store-schema-directory): a committed
# copy goes stale the moment an annotation changes without a rebuild+recommit. The single source of
# truth is the annotations in the code; consumers read the generated document live from /q/openapi
# or the Swagger UI at /api (both admin-gated).
# API title/version/description live in the @OpenAPIDefinition on net.zodac.diurnal.openapi.DiurnalApiDefinition
# (alongside the security schemes below), not in quarkus.smallrye-openapi.info-* config. The declared
# version is only a fallback: PublicApiFilter overwrites info.version at build time with the packaged
# VERSION file (the same source the footer reads), so the docs track the real release.
# The API's sole auth scheme (BearerAuth = HTTP bearer, an opaque session token) is declared as a @SecurityScheme
# annotation on net.zodac.diurnal.openapi.DiurnalApiDefinition rather than via the
# quarkus.smallrye-openapi.security-scheme* config, so it is pinned to a plain HTTP bearer scheme.
# auto-add-security=false stops Quarkus auto-deriving an EXTRA scheme from the enabled security
# extensions — with OIDC enabled that adds an 'openIdConnect' Authorize option, which we do not
# want; only the single scheme declared above should appear.
quarkus.smallrye-openapi.auto-add-security=false
# Also stop auto-stamping every secured operation with a generic security requirement + 401/403
# responses: each documented operation declares its real responses and auth explicitly (via
# @APIResponse / @SecurityRequirement) so the listed status codes match what the endpoint returns.
quarkus.smallrye-openapi.auto-add-security-requirement=false

# --- OIDC ---
# The OIDC extension must be enabled at BUILD TIME so its CDI beans and auth mechanism are
# registered. Runtime enable/disable is via quarkus.oidc.tenant-enabled (a runtime property).
# When tenant-enabled=false Quarkus skips discovery and the mechanism is inactive.
quarkus.oidc.enabled=true
quarkus.oidc.tenant-enabled=${OIDC_ENABLED:false}
# Placeholder prevents Quarkus startup failure when OIDC is disabled and no URL is configured.
quarkus.oidc.auth-server-url=${OIDC_ISSUER_URL:http://disabled.invalid}
quarkus.oidc.client-id=${OIDC_CLIENT_ID:diurnal}
quarkus.oidc.credentials.client-secret.value=${OIDC_CLIENT_SECRET:}
quarkus.oidc.credentials.client-secret.method=post
# Always web-app type: when OIDC is disabled the extension is fully inert so this has no effect.
quarkus.oidc.application-type=web-app
# Request email, profile, and groups claims. openid is added automatically by Quarkus; only list the
# additional scopes here. The groups scope is needed so Authelia/LLDAP includes group membership —
# but it is NOT a standard OIDC scope, and some providers (e.g. Google) reject unknown scopes with
# invalid_scope before ever reaching the callback. Override OIDC_SCOPES (comma-separated) for such
# providers, e.g. OIDC_SCOPES=email,profile — group→role mapping then simply has no groups to read.
quarkus.oidc.authentication.scopes=${OIDC_SCOPES:email,profile,groups}
# PKCE (RFC 7636) on top of the confidential client secret — current best practice (OAuth 2.1
# direction) and supported by Authelia/Keycloak/Google alike; providers that ignore the
# code_challenge parameter are unaffected. Set OIDC_PKCE_ENABLED=false for a provider that
# actively rejects PKCE from confidential clients.
quarkus.oidc.authentication.pkce-required=${OIDC_PKCE_ENABLED:true}
# Fetch the UserInfo endpoint after login. Authelia (and many IdPs) return email/name from
# UserInfo rather than embedding them in the ID token, even when the email scope is granted —
# OidcUserProvisioner needs the email to provision the local user on first OIDC login.
quarkus.oidc.authentication.user-info-required=true
# Pin the redirect_uri to / so you only need to register one callback URL with your IdP.
quarkus.oidc.authentication.redirect-path=/oauth2/callback/oidc
# Redirect to the login page with an error indicator when OIDC authentication fails
# (e.g. token validation failure, or the user is not in an authorised group).
quarkus.oidc.authentication.error-path=/login?error=oidc
# Session persistence — keep OIDC sessions as long-lived as the form/password session (P90D).
# By default, a Quarkus web-app session ends at the ID token's expiry (often ~1h) with no refresh,
# logging OIDC users out far sooner than password users. These three settings close that gap:
#   1. refresh-expired: when the access/ID token expires, silently refresh it using the stored
#      refresh token instead of forcing an IdP round-trip.
#   2. refresh-token-time-skew: grace period — refresh proactively this long BEFORE expiry, on the
#      live request, so an active user never trips an already-expired token mid-session.
#   3. session-age-extension: keep the q_session cookie (and thus the refresh token) usable across
#      idle time, beyond the short ID-token expiry. Set to match the form timeout / your IdP's
#      refresh-token lifetime (Authelia default: 90 days).
# The q_session token state is encrypted with a key derived from the (stable) client secret, so the
# session also survives an app restart/upgrade — no extra config needed for that.
quarkus.oidc.token.refresh-expired=true
quarkus.oidc.token.refresh-token-time-skew=5M
quarkus.oidc.authentication.session-age-extension=P90D
# RP-initiated logout
oidc.logout.url=${OIDC_LOGOUT_URL}
# Display name for the IdP shown in the login button, e.g. "Log in with Authelia".
oidc.provider.name=${OIDC_PROVIDER_NAME:your identity provider}
# LDAP group names that map to admin/user roles for OIDC-provisioned accounts.
# When not set, the first-user-admin rule applies; all others default to user.
# oidc.admin.group=${OIDC_ADMIN_GROUP}
# oidc.user.group=${OIDC_USER_GROUP}
# If true, /login immediately redirects to the OIDC flow rather than showing the login page.
# Only applies when OIDC_ENABLED=true. Suppressed when ?error or ?registered params are present.
oidc.auto.redirect=${OIDC_AUTO_REDIRECT:false}
# If true (default), the app probes the IdP's discovery endpoint at startup and refuses to boot when
# the provider is unreachable or invalid - so a misconfigured issuer fails the deploy instead of the
# first user's login (Quarkus fetches discovery lazily). Only applies when OIDC_ENABLED=true and
# Quarkus discovery is enabled. Set false to skip (e.g. the screenshot generator's dummy IdP).
oidc.verify.on.startup=${OIDC_VERIFY_ON_STARTUP:true}

# --- Logging ---
# Twelve-Factor (XI. Logs): the app is a Docker image, so logs are an unbuffered event stream to the
# console (stdout) only — never a file. The console handler is on; the file handler stays off.
quarkus.log.console.enabled=true
quarkus.log.file.enabled=false
# Console line format. This is the Quarkus's backend syntax, NOT Log4j2's:
# %d=timestamp (zone follows TZ / app.timezone), %-5p=level, %c=logger name, %s=message,
# %e=exception, %n=newline. The thread (%t) is intentionally omitted; for a shorter logger use
# %c{3.} (n.z.d.AppLifecycle). The committed docs/logging-reference.log4j2.xml mirrors this in Log4j2 syntax.
quarkus.log.console.format=%d{yyyy-MM-dd HH:mm:ss.SSS} [%-5p] [%c] %s%e%n
# Colourise the bracketed level per level. Quarkus only emits ANSI when the console supports colour
# (off when stdout is piped, e.g. captured by Docker), so force it on; set false if a downstream log
# sink cannot cope with ANSI escapes.
quarkus.console.color=true
# LOG_LEVEL controls net.zodac.diurnal.* only; Quarkus/framework noise stays at WARN.
# Prod default: INFO. Set LOG_LEVEL=DEBUG to see login events and detailed traces.
quarkus.log.level=WARN
quarkus.log.category."net.zodac.diurnal".level=${LOG_LEVEL:INFO}
quarkus.log.category."org.flywaydb".level=INFO

# Quieten Quarkus's own OIDC "server unavailable" noise at startup. The OIDC extension eagerly probes the IdP during
# its runtime-init (BEFORE the StartupEvent that AppLifecycle.verifyOidcDiscovery observes - hence Quarkus's failure
# logs appear first), and when the provider is unreachable/invalid it reports it several times over, including the
# OidcEndpointAccessException stack trace at WARN. Our own startup probe already reports the failure with one
# actionable message (and fails the boot when OIDC_VERIFY_ON_STARTUP=true), so most of that is redundant. Using
# Quarkus's log-cleanup filter (map key = logger name; if-starts-with = message prefix, matched against the raw
# template so it works before %s substitution; target-level re-levels the matched record), demote the discovery-failure
# lines and the stack-trace line to DEBUG - so they surface only when the OIDC categories are turned up for debugging.
# One WARN line is deliberately kept ("OIDC server is not available at the '...' URL", logged by OidcRecorder and NOT
# matched here) as the concise signal; the boot-failure stack trace still prints once at ERROR. Case matters: the kept
# line starts "OIDC server ..." (lowercase s), the demoted OidcCommonUtils line "OIDC Server ..." (capital S).
quarkus.log.filter."io.quarkus.oidc.common.runtime.OidcCommonUtils".if-starts-with=Discovery request,OIDC Server is not available
quarkus.log.filter."io.quarkus.oidc.common.runtime.OidcCommonUtils".target-level=DEBUG
quarkus.log.filter."io.quarkus.oidc.runtime.OidcRecorder".if-starts-with=Tenant '
quarkus.log.filter."io.quarkus.oidc.runtime.OidcRecorder".target-level=DEBUG

# --- Database query tracing (TRACE) ---
# Every SQL statement the app issues to Postgres — and, at TRACE, the bound parameter values — can be
# surfaced on demand for deep debugging of what the backend actually asks the database. It is OFF by
# default (kept at WARN so the framework categories stay silent in production); set DB_LOG_LEVEL=TRACE
# to turn on full DB request tracing. `org.hibernate.SQL` emits the statement, `...jdbc.bind` the
# parameter bindings. The build-time `min-level` floor must permit TRACE for the runtime category
# level to take effect (it only lowers the floor; actual output is still gated by the levels above).
quarkus.log.min-level=TRACE
quarkus.log.category."org.hibernate.SQL".level=${DB_LOG_LEVEL:WARN}
quarkus.log.category."org.hibernate.orm.jdbc.bind".level=${DB_LOG_LEVEL:WARN}

# The application-level RequestLoggingFilter already excludes the container's /api/v1/status probe. Quarkus's
# built-in HTTP access log is OFF by default, but if it is ever enabled (quarkus.http.access-log.enabled),
# exclude the same high-frequency probe there too so it can't reintroduce the noise.
# NOTE: the access log's default pattern records the full request line INCLUDING the query string, so turning it
# on writes every notes search term (/notes?q=..., /internal/notes/list?q=..., /api/v1/notes?q=...) to the log.
# A search term is drawn from the note it is meant to find, and must never be logged (see NoteService and
# .claude/NOTES.md) - so if the access log is ever enabled, give it a pattern that omits the query string.
quarkus.http.access-log.exclude-pattern=/api/v1/status
