# American English message-bundle content for web.AppMessages.
# Phase 5 of .claude/I18N.md - see that file for the translation-workflow decisions.
#
# en-GB is the bundle's DEFAULT locale (the @Message annotation values ARE en-GB's content - see that
# class's own Javadoc), so this file is deliberately SPARSE: only the entries whose wording is spelled
# differently in American English are listed here at all. Every other entry falls back to the en-GB
# default unchanged - a sparse diff, not a full duplicate, since the two variants share the overwhelming
# majority of their wording; only the words that genuinely differ are worth a second copy. US vs UK date
# ORDER needs no entry here at all - that
# already falls out of Language.locale() carrying the "US" region into java.time's own CLDR data (see
# Phase 2), not from bundle content.
#
# The only real spelling difference this app's own vocabulary touches: "-our" -> "-or" (colour -> color,
# behaviour -> behavior) and "-ised" -> "-ized" (authorised -> authorized). Checked for the other common
# British/American pairs (whilst/while, amongst/among, -ise/-ize verbs like realise/organise, grey,
# catalogue, centre, licence, practise, learnt) and none of them occur anywhere in the interface's actual
# @Message text - this app's vocabulary is narrower than a general-purpose translation would need.

