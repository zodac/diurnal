# American English message-bundle content for web.AppMessages.
# Phase 5 of .claude/I18N.md - see that file for the translation-workflow decisions.
#
# FULLY DUPLICATED (all AppMessages keys), not the sparse spelling-only diff this file used to be - a
# deliberate reversal, made specifically to give CrowdIn/Weblate a complete target-language file to manage.
# This trades away the earlier design's one real benefit: since every key now has explicit content here,
# this file no longer automatically inherits a future wording change to the en-GB default in
# AppMessages.java - if a shared @Message value changes, the corresponding line here needs a matching
# edit, or the two will silently diverge. The set of entries that differ from the en-GB default for a
# genuine SPELLING reason (colour -> color, behaviour -> behavior, authorised -> authorized) is still
# exactly the same handful documented below; every other line is currently identical en-GB/en-US text,
# repeated here only because a complete file is what this session's decision called for.
#
# The only real spelling difference this app's own vocabulary touches: "-our" -> "-or" (colour -> color,
# behaviour -> behavior) and "-ised" -> "-ized" (authorised -> authorized). Checked for the other common
# British/American pairs (whilst/while, amongst/among, -ise/-ize verbs like realise/organise, grey,
# catalogue, centre, licence, practise, learnt) and none of them occur anywhere in the interface's actual
# @Message text - this app's vocabulary is narrower than a general-purpose translation would need.
# US vs UK date ORDER needs no entry here at all - that already falls out of Language.locale() carrying
# the "US" region into java.time's own CLDR data (see Phase 2 of .claude/I18N.md), not from bundle content.

