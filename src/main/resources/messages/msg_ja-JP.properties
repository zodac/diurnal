# Japanese message-bundle content for web.AppMessages.
# Phase 5 of .claude/I18N.md - see that file for the translation-workflow decisions.
#
# Register: polite teineigo (desu/masu) throughout for sentences, matching the convention major
# localized software (Google, Microsoft, LINE) already uses for Japanese UI; short button/label text
# uses the plain noun form real Japanese software uses for those (e.g. "hozon" alone for Save, not a
# full sentence), the same "match the established convention" reasoning the es-ES/ar-SA slices applied
# to their own register choices.
#
# Domain vocabulary, picked once and reused everywhere it recurs: "akushon" (action, loanword) for
# action, "memo" (loanword) for note, "renzoku kiroku"/"renzoku nissuu" (continuous record/consecutive
# days) for streak, "kuuhaku kikan" (blank period) for gap, "dasshubo-do" (loanword) for dashboard,
# "settei" for settings. Proper nouns/brand names stay untranslated per the existing precedent:
# "Diurnal", "GitHub", "Nova", "OpenDyslexic" are not translated. "API"/"OIDC" ARE transliterated, though
# (authSourceOidc/authSourceLocalOidc/apiNavLink) - unlike a brand name, an initialism is unreadable to
# someone who doesn't already know Latin letter names, so it gets the same katakana phonetic-spelling
# treatment any other foreign initialism gets in real Japanese usage (PDF -> Pi-Di-Efu, USB -> Yu-Esu-Bi):
# API -> "eepiiai" (A-P-I), OIDC -> "ooaidiishii" (O-I-D-C).
#
# No plural grammar needed - Japanese nouns do not inflect for number, so every {#if count == 1}...
# {#else}...{/if} pair below carries the identical Japanese text in both branches (the branching
# structure is kept only because every locale's properties file must supply the same {#if} shape the
# @Message value declares - see AppMessagesIT's own render-every-entry test).

