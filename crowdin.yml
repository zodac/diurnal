# CrowdIn CLI configuration for the web.AppMessages bundle - see .claude/I18N.md's "Translation tooling"
# section. Read by .github/workflows/crowdin_upload.yml, which is the ONLY thing that uses it: downloads
# are owned by the CrowdIn GitHub integration (configured in CrowdIn's own UI, not here), while that
# workflow pushes BOTH the source file and the translations. It exists because the integration cannot
# import a translation whose text equals the source string, and it carries the source alongside them so
# that a reworded string and its translations reach CrowdIn in one ordered upload - see that workflow's
# header. Nothing discovers this file by convention - the workflow names it explicitly.
#
# The two *_env lines below are what wire the credentials in, and they are REQUIRED rather than decorative:
# because the workflow passes this file with `--config`, the CLI takes its credentials from here and does NOT
# fall back to the ambient environment, so omitting them authenticates with nothing and fails as
# "Couldn't authorize. Check your 'api_token'" - identical to the error for a genuinely bad token.
# They name the ORGANISATION secrets (zodac, scoped to public repos); never put a real token in this file.
#
# The languages_mapping keys below are the codes CROWDIN assigns, and they are NOT always the
# region-qualified BCP 47 tag this app stores as Language.value() - CrowdIn's default Japanese code is
# "ja", not "ja-JP". If an upload reports a language it cannot match, fix the LEFT-hand side to whatever
# the project actually uses; the right-hand side is the file name and follows Language.value().
#
# The source file is generated - run scripts/generate-source-messages.sh after any @Message wording change.

"project_id_env": "CROWDIN_PROJECT_ID"
"api_token_env": "CROWDIN_PERSONAL_TOKEN"

"base_path": "."

# The project holds the file at `master > translations > msg_en-GB.properties`, mirroring this repo's own
# layout, because the GitHub integration preserves the directory structure when it syncs. The CLI does NOT
# do that by default - it flattens, and would look for `msg_en-GB.properties` at the branch root, match
# nothing, and exit 0. `master` itself is a VERSION BRANCH, named in the workflow as crowdin_branch_name.
"preserve_hierarchy": true

"files":
  - "source": "/translations/msg_en-GB.properties"
    "translation": "/src/main/resources/messages/msg_%locale%.properties"
    "type": "properties"

    # Both of these default ON for a .properties file, and both produce corruption rather than escaping here,
    # because a translated value is a QUTE TEMPLATE and not a MessageFormat pattern - see .claude/I18N.md's
    # "Platform escaping" guard, which is the backstop that catches them.
    #   escape_special_characters (default 1) backslash-escapes `=`, `:`, `!` and `#`, which turns every `{#if`
    #     into `{\#if` and every `==` into `\=\=`. Qute then reads the section tag as literal text and its
    #     `{/if}` as unopened, failing the build in `analyzeTemplates`.
    #   escape_quotes (default 3) doubles a single quote to `''` in any value holding a placeholder, so
    #     `An action named '{name}'` comes back with `''` around the name.
    # These are FILE settings held by CrowdIn, not merely CLI switches, so the value here is only asserted when
    # something uploads the source through this config. The GitHub integration's export reads whatever the
    # project holds, so ALSO confirm it in the UI (Sources > the file > settings) rather than trusting this file
    # alone - it is the export, not the upload, that writes the bundles the repo has to live with.
    "escape_special_characters": 0
    "escape_quotes": 0
    "languages_mapping":
      "locale":
        "es-ES": "es-ES"
        "ar-SA": "ar-SA"
        "ja-JP": "ja-JP"
        "en-US": "en-US"
