networks:
  diurnal-network:
    name: diurnal-network
    driver: bridge
  # Backend network for app<->database traffic only, no egress
  diurnal-internal:
    name: diurnal-internal
    driver: bridge
    internal: true

services:

  diurnal:
    image: zodac/diurnal:latest
    container_name: diurnal
    hostname: diurnal
    cap_drop:
      - ALL
    depends_on:
      diurnal-db:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: "2G"
          pids: "256"
    memswap_limit: "2G"
    env_file:
      - .env
    environment:
      # Database configuration
      DB_HOST: "diurnal-db"
      DB_PORT: "5432"
      DB_NAME: "diurnal_db"
      DB_USER: "diurnal_user"
      DB_PASSWORD: "change-me-strong-password"  # <--- TODO: Change this
      # Application configuration
      LOG_LEVEL: "DEBUG"
      NOTE_ENCRYPTION_KEY: "change-me-strong-password"  # <--- TODO: Change this, generate using `openssl rand -base64 32`
      TZ: "UTC"
      # Authentication config
      ENABLE_REGISTRATION: "true"
      PASSWORD_AUTH_ENABLED: "true"
      # OIDC config
      OIDC_CLIENT_ID: "diurnal"
      OIDC_CLIENT_SECRET: "diurnalClientSecret"  # <--- TODO: Change this
      OIDC_ENABLED: "false"
      OIDC_ISSUER_URL: "https://auth.example.com"
      OIDC_LOGOUT_URL: "https://auth.example.com/logout"
      OIDC_PROVIDER_NAME: "Authelia"
      # Reverse proxy config
      # Set to "true" ONLY when this container sits behind a TLS-terminating reverse proxy (Traefik, nginx, Caddy) that sets X-Forwarded-*
      TRUST_X_FORWARDED_HEADERS: "false"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - diurnal-internal  # reaches the database, which lives only on this internal network
      - diurnal-network   # egress for OIDC discovery + the GitHub update-check
    ports:
      - "127.0.0.1:8080:8080"
    # Immutable root filesystem - the app writes nothing outside /tmp (session state is in Postgres,
    # logs go to stdout), so the rootfs is read-only and /tmp stays writable via the tmpfs mount below.
    read_only: true
    restart: unless-stopped
    security_opt:
      - no-new-privileges=true
    tmpfs:
      - /tmp:size=64m,noexec,nosuid,nodev
    user: "65532:65532"  # nonroot user

  diurnal-db:
    image: postgres:18.6-alpine
    container_name: diurnal-db
    hostname: diurnal-db
    command:
      - -ccheckpoint_timeout=15min
      - -ceffective_cache_size=768MB
      - -cjit=off
      - -cmaintenance_work_mem=128MB
      - -cmax_connections=25
      - -cmax_wal_size=2GB
      - -cmin_wal_size=256MB
      - -crandom_page_cost=1.1  # 1.1 assumes SSD/NVMe, set it to 4 if the database lives on a spinning disk
      - -cshared_buffers=256MB
      - -cwal_compression=lz4
      - -cwork_mem=8MB
    environment:
      PGDATA: /var/lib/postgresql/data/pgdata
      POSTGRES_DB: "diurnal_db"
      POSTGRES_PASSWORD: "change-me-strong-password"  # <--- TODO: Change this
      POSTGRES_USER: "diurnal_user"
      TZ: "UTC"
    expose:
      - "5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U diurnal_user -d diurnal_db" ]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 5s
      start_interval: 5s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - diurnal-internal
    restart: unless-stopped
    security_opt:
      - no-new-privileges=true
    tmpfs:
      - /tmp:size=64m,noexec,nosuid,nodev
      - /var/run/postgresql:uid=999,gid=999,mode=775
    user: "999:999"  # postgres user
    volumes:
      - diurnal-db_data:/var/lib/postgresql/

volumes:
  diurnal-db_data:
    name: diurnal-db_data
