# The sandbox settings for this project, read by ai-sandbox/sandbox.sh on every launch.
#
# Plain bash, sourced on the HOST. Every value is a space-separated string, and an environment
# variable of the same name overrides it for one launch (`SANDBOX_PORTS= ai-sandbox/sandbox.sh`).
# See ai-sandbox/README.md for the full reference.

# Ports published to the host, as `host:container` pairs. The in-sandbox dev server runs on container
# :8081 (e.g. scripts/dev-up.sh) and is published on host :8071 - deliberately NOT :8081, so the host's
# own 8081 stays free for host-native dev/tests.
SANDBOX_PORTS="8071:8081"

# Named cache volumes, as `name:/container/path` pairs - each survives the sandbox's teardown as the
# docker volume `<sandbox-name>-<name>`:
#   m2 - the Maven local repository, or every fresh sandbox re-downloads the project's whole dependency
#        set (~124MB / 365 jars, i.e. minutes added to the first `mvn` run)
#   pw - Playwright's Chromium, downloaded per Playwright version by setup.d/20-playwright.sh
SANDBOX_CACHE_VOLUMES="m2:/home/dev/.m2 pw:/home/dev/.cache/ms-playwright"

# Directories (relative to the project root) whose package.json gets an `npm install` on each interactive
# open, re-run only when its package-lock.json changes. The repo root has no package.json; tests/ is what
# provides the Playwright that the E2E tier and setup.d/20-playwright.sh both run.
SANDBOX_NPM_DIRS="frontend tests"

# Extra environment for the sandbox, as KEY=VALUE pairs (no spaces inside a value). JAVA_HOME,
# MAVEN_HOME and PLAYWRIGHT_BROWSERS_PATH come from the Dockerfile's ENV, so nothing is needed here.
SANDBOX_ENV=""

# Extra `docker run` flags, passed through as-is (e.g. "--shm-size 2g").
SANDBOX_RUN_ARGS=""

# Days of Claude session history (transcripts, file history, tool results) to keep in
# .claude-history; anything older is deleted when Claude starts. Memory and settings are always kept.
SANDBOX_HISTORY_DAYS=14

# Pin the docker name prefix instead of deriving it from this checkout's path (rarely needed).
# SANDBOX_NAME=""

# The sandbox's timezone (an IANA name); defaults to the host's.
# SANDBOX_TZ=""
