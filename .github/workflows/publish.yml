name: Build and Publish Docker Image

# Never scheduled — only a push to a gate-relevant file on master, or a manual dispatch.
#
# A QUALIFYING PUSH TO MASTER RELEASES, and so does a non-dry-run dispatch. The dispatch is an OPTION -
# the way to release without a qualifying code change, or (with dry-run) to exercise the pipeline without
# spending a version number - never the only route. The trigger's path list is read as "what needs
# gating", which is why translations/** belongs in it even though the comment beside it says it reaches
# no image; a push matching any of those paths both gates and ships.
#
# THE KNOWN COST, accepted deliberately: "anything that could break the build" is a wider set than
# "anything that should ship", and no path filter can separate them, because the same file edit is both a
# reason to run the gate and not a reason to release. On 2026-09-13 that cost was paid in full - master
# cut EIGHT releases (1.0.4 through 1.0.7, two of the runs red), none of them intended as one. Release-on-
# push was removed the next day in response, bundled into d3dfa50 (a commit about parallelising the gate),
# and is restored here on purpose: a release per qualifying push is the wanted behaviour, and a spent
# patch number is cheaper than a release that only happens when someone remembers to press a button.
# If that judgement is ever revisited, narrowing to "the push changed VERSION" is the smaller fix -
# the version bump is the deliberate ship signal - not removing push releases again.
#
# No release loop, and it is the platform that guarantees it rather than anything here: the `publish` job
# ends by committing `[CI] Prepare next version: X` (VERSION + pom.xml, both in the path list below, with
# no `[skip ci]`) and pushing it with `secrets.GITHUB_TOKEN`, and GitHub does not start a workflow run
# from a push made with that token. Swapping that token for a PAT reintroduces the recursion.
on:
  push:
    branches: [ master ]
    # Scope: what needs the gate run over it
    paths:
      - 'Dockerfile'
      - 'pom.xml'
      - 'frontend/**' # the npm manifest, Tailwind config and CSS source all feed the image's stylesheet
      - 'src/**'
      - '!src/test/**' # test code never reaches the published image (packaged with -DskipTests)
      - 'translations/**' # Not an image input - only so a source-export-only commit reaches the `translations` job
      - 'VERSION'
  # A manual trigger is a release too - image pushed, tag created, VERSION bumped - and these two inputs
  # are what let the pipeline be measured without spending a version number on it. They are dispatch-only:
  # a push to master reads neither (the `inputs` context is null there), which is why the `publish` job's
  # `if:` has to short-circuit on the event name before it looks at dry-run.
  workflow_dispatch:
    inputs:
      dry-run:
        description: 'Run the gate and the preview build, but publish nothing'
        type: boolean
        default: false
      # Left at false, a dispatch releases exactly as a qualifying push does. Set true to gate and build
      # the preview image while publishing nothing - the only way to run this pipeline without a release.
      gate-steps:
        description: 'Steps the gate jobs should cover (the perf suite runs as its own job). Split across them by gate_job_steps.sh'
        type: string
        default: 'docker,java'

jobs:
  # Resolve the release version. Read on every run - the gate jobs and `preview` want it too - but only a
  # non-dry-run DISPATCH goes on to spend it (see the `publish` job).
  version:
    name: Resolve version
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      - name: Read version
        id: version
        run: |
          version="$(cat VERSION)"
          echo "version=${version}" >> "${GITHUB_OUTPUT}"
          echo "Read version: ${version}"

  translations:
    name: Check translation bundles
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      # cache-enabled: the action keys ~/.m2/repository on hashFiles('**/pom.xml'), which bump_version.sh
      # changes on every release - so the key never matched and a fresh ~440MB entry was written every run.
      # See the note in `gate-build`, which owns the replacement cache; this job only READS it (via
      # actions/cache/restore, which has no save step) so exactly one writer keeps the entry current.
      - name: Setup Maven Action
        uses: s4u/setup-maven-action@v1.21.0
        with:
          cache-enabled: false
          java-distribution: 'temurin'
          java-version: '26'
          maven-version: '3.9.16'

      - name: Restore the Maven repository
        uses: actions/cache/restore@v6.1.0
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-m2-
          restore-keys: |
            ${{ runner.os }}-m2-

      - name: Check message bundles with AppMessageCoverageTest
        run: mvn test -Dtests -Dtest=AppMessageCoverageTest -Dcss.build.skip=true

  # ---- The gate, split across three jobs ---------------------------------------------------------------
  #
  # This used to be ONE job (`test`) running `lint_and_tests.sh docker,java`, and it WAS the release: 25-28
  # minutes of a ~26-minute pipeline, with every other job finishing inside the first six and then waiting.
  # Measured on two back-to-back dry runs of the same commit (34783820188, 34785465905), the gate step alone
  # was 24m23s and 26m40s while `preview` - the next longest - was 5m34s and 0m46s.
  #
  # Caching was not the lever and adding more of it never could be. Between those two runs the Qodana index
  # went from a cold miss to a hit and the preview image build went 5m03s -> 0m11s on the registry cache, and
  # the pipeline still got SLOWER (25m37s -> 27m54s). Every cache restore in the job together came to ~24s of
  # those ~26 minutes: the caches move DOWNLOAD time, and what is left is compute.
  #
  # The compute is the problem, and it is a scheduling one. lint_and_tests.sh runs the java gate's tiers
  # concurrently, costing max(mvn + e2e, smoke, qodana) instead of their sum - a design calibrated, in that
  # script's own comments, ON A 16-CORE BOX. A standard GitHub runner is 4 vCPU, so PITest, Chromium, a
  # multi-stage image build and the IntelliJ indexer time-share four cores and the max() collapses back
  # towards the sum; the script records the tiers stretching by +25% (mvn) and +70% (the scan) merely under a
  # load holding 7 of 16 cores. On top of that a `docker` step including its grype tier is deliberately NOT
  # lane-eligible, so the CVE scan ran serially after all of it.
  #
  # So the tiers are split across JOBS, which is the same move already made for `perf` and `preview` and for
  # the same reason: a separate job is a separate VM, so each group gets four uncontended cores instead of a
  # quarter share of one box, and the critical path becomes a real max() rather than a contended one.
  #
  # What is NOT split, and why - both of these would cost more than they save:
  #   - java:mvn and java:e2e stay together. E2E boots the fast-jar the Maven tier packages, so splitting
  #     them buys nothing (they cannot overlap) and costs an artifact upload/download of target/quarkus-app.
  #   - java:smoke and docker stay together, in that order. The smoke tier and the grype tier build the SAME
  #     production image from the same Dockerfile with the same GENERATE_PREVIEWS=false; run in one job the
  #     second is a layer-cache hit, and in separate jobs both would build it cold. `docker` is passed whole
  #     rather than as `docker:grype` so its hadolint tier - seconds, and free beside the scan - is still run.
  #
  # Each job asks gate_job_steps.sh which part of the `gate-steps` input is its own, rather than hardcoding
  # its steps: the input has to keep working now that no single job receives it, and one shared answer cannot
  # drift the way four inline YAML copies would. A job with nothing to do SUCCEEDS rather than being skipped -
  # `publish` needs all three, and GitHub skips a job whose dependency was skipped, so an `if:` here would
  # silently cancel the release on exactly the runs that narrow the gate.

  gate-build:
    name: Gate - Maven build and E2E
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    # Fold SonarQube analysis into the existing Maven build (no duplicate build): SONARQUBE_ANALYSIS=true
    # makes lint_and_tests.sh append -Dsonarqube to its `mvn clean install -Dall`, and the parent-pom reads
    # the host URL + token straight from these env vars (sonar.host.url / sonar.token). Because a release
    # only ever runs on a master push / manual dispatch, every release is analysed and uploaded.
    #
    # The analysis is filed under the VERSION file's release version rather than the pom's -SNAPSHOT, which
    # the scanner would otherwise default to: lint_and_tests.sh passes -Dsonar.projectVersion itself. It has
    # to be done there and not here - the `publish` job's `mvn versions:set` is a separate job on its own
    # checkout, and runs only once this one is already green.
    #
    # This is the job that carries it because the analysis is a goal of the Maven build, not a step beside
    # it; the other two gate jobs run no Maven at all.
    env:
      SONARQUBE_ANALYSIS: 'true'
      SONARQUBE_HOST_URL: ${{ secrets.SONARQUBE_HOST_URL }}
      SONARQUBE_PAT: ${{ secrets.SONARQUBE_RW_PAT }}

    steps:
      # submodules: code-quality-config holds the linter configs used by the -Dall gate.
      - name: Checkout repository
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          submodules: true

      - name: Resolve the steps this job owns
        id: gate
        env:
          # Via the environment rather than interpolated straight into the script: a `${{ }}` expansion is
          # pasted in as TEXT before bash ever sees the line, so a dispatch input containing a quote would
          # otherwise end the argument and run whatever followed it.
          GATE_STEPS: ${{ inputs.gate-steps || 'docker,java' }}
        run: |
          set -euo pipefail
          selected="$(.github/scripts/gate_job_steps.sh "${GATE_STEPS}" 'java:mvn,java:e2e')"
          echo "selected=${selected}" >> "${GITHUB_OUTPUT}"
          echo "Running: ${selected:-<nothing - not selected by gate-steps>}"

      - name: Set up Node.js
        if: steps.gate.outputs.selected != ''
        uses: actions/setup-node@v7.0.0
        with:
          node-version: '26.8.2'

      # checkout-enabled: the checkout above already ran, WITH submodules. Left at its default this action
      # checks the repository out a second time, and its own checkout takes no submodules - so the shared
      # linter configs would depend on a second clone happening to leave them behind.
      #
      # cache-enabled: this action caches ~/.m2/repository under a key ending in hashFiles('**/pom.xml'),
      # and bump_version.sh rewrites the pom's <version> on EVERY release - so the key never matched and a
      # fresh ~440MB entry was saved every single run. That is the same failure the Grype step below carries
      # a warning about, and it was by far the biggest consumer of the repository's 10GB cache budget (3.5GB
      # across 8 entries in one day), evicting the Qodana index and Playwright browsers that actually pay for
      # themselves. The cache is taken over by the explicitly-keyed step below instead.
      - name: Setup Maven Action
        if: steps.gate.outputs.selected != ''
        uses: s4u/setup-maven-action@v1.21.0
        with:
          checkout-enabled: false
          cache-enabled: false
          java-distribution: 'temurin'
          java-version: '26'
          maven-version: '3.9.16'

      # The Maven tier runs inside MVN_BUILD_IMAGE (see build_mvn_docker_cmd) with the host's $HOME bind-
      # mounted and -Dmaven.repo.local pointed into it, so the container resolves into THIS directory - the
      # reason the repository is worth caching even though the gate brings its own JDK and Maven.
      #
      # Keyed on the DAY, exactly like the Grype DB below and for the same reason: the key decides when a new
      # entry is WRITTEN, while restore-keys decides what is read, so a date key writes at most one ~440MB
      # entry a day and the prefix still restores the most recent one. A dependency added between writes is
      # simply downloaded by Maven and folded into the next day's entry - the repository is incremental, so a
      # key that lags a change costs one download rather than a wrong answer.
      - name: Resolve today's date for the Maven cache key
        id: m2_day
        if: steps.gate.outputs.selected != ''
        run: |
          day="$(date -u +%F)"
          echo "day=${day}" >> "${GITHUB_OUTPUT}"

      - name: Cache the Maven repository
        if: steps.gate.outputs.selected != ''
        uses: actions/cache@v6.1.0
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-m2-${{ steps.m2_day.outputs.day }}
          restore-keys: |
            ${{ runner.os }}-m2-

      # Node deps: the POM's css-build exec runs `npm run css` in frontend/ (inside the Maven container,
      # against this host-side node_modules through the same-path mount); the E2E run uses tests/ deps.
      - name: Install CSS build dependencies
        if: steps.gate.outputs.selected != ''
        working-directory: frontend
        run: npm ci

      # Cache the downloaded Playwright browser binaries (the slow part). Keyed on the E2E lockfile so a
      # Playwright version bump invalidates it. OS-level deps (`--with-deps`) are NOT cached, so on a hit
      # we still run `install-deps` below.
      - name: Cache Playwright browsers
        id: playwright-cache
        if: steps.gate.outputs.selected != ''
        uses: actions/cache@v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('tests/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-playwright-

      # `chromium` is named explicitly because a bare `install` pulls Firefox and WebKit too, and NOTHING
      # runs on them: playwright.config.ts defines chromium + mobile-chrome (a chromium device preset) and
      # playwright.smoke.config.ts defines chromium alone. Naming it cuts the download and, more
      # importantly, keeps the cached directory small - see the repository cache-budget note on the Maven
      # step above. Add the browser here if a config ever gains a project running on one.
      - name: Install E2E dependencies and browsers
        if: steps.gate.outputs.selected != ''
        working-directory: tests
        run: |
          npm ci
          if [ "${{ steps.playwright-cache.outputs.cache-hit }}" = "true" ]; then
            npx playwright install-deps chromium
          else
            npx playwright install --with-deps chromium
          fi

      - name: Run the Maven build and E2E suite
        if: steps.gate.outputs.selected != ''
        env:
          # Not a perf knob: how much of each failing TIER's log the wrapper re-prints before its summary.
          # Wider here than the local default of 40 because this excerpt is all a red run leaves behind -
          # the logs themselves live in the runner's /tmp and die with the job, so anything the tail cuts
          # off is gone rather than one `grep` away. 150 covers a Maven reactor summary with its whole
          # failing-test list, or a Playwright failure with its diff.
          GATE_FAILURE_TAIL_LINES: "150"
          GATE_SELECTED: ${{ steps.gate.outputs.selected }}
        run: .github/scripts/lint_and_tests.sh "${GATE_SELECTED}" -v -e

  gate-image:
    name: Gate - deployment smoke and image scan
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read

    steps:
      # submodules: code-quality-config holds the shared hadolint config and the grype won't-fix ignore list.
      - name: Checkout repository
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          submodules: true

      # `docker` whole rather than `docker:grype` - see the note above the gate jobs. The smoke tier is named
      # first but the ORDER here does not decide execution: lint_and_tests.sh runs the lane-eligible `java`
      # step first and a grype-bearing `docker` step in the serial tail, which is precisely the order that
      # makes the second image build a cache hit.
      - name: Resolve the steps this job owns
        id: gate
        env:
          # Via the environment rather than interpolated straight into the script: a `${{ }}` expansion is
          # pasted in as TEXT before bash ever sees the line, so a dispatch input containing a quote would
          # otherwise end the argument and run whatever followed it.
          GATE_STEPS: ${{ inputs.gate-steps || 'docker,java' }}
        run: |
          set -euo pipefail
          selected="$(.github/scripts/gate_job_steps.sh "${GATE_STEPS}" 'docker,java:smoke')"
          echo "selected=${selected}" >> "${GITHUB_OUTPUT}"
          echo "Running: ${selected:-<nothing - not selected by gate-steps>}"

      # No Maven and no frontend deps: the smoke tier builds the production image from the Dockerfile, which
      # compiles the CSS and the fast-jar in its own stages. Node and Playwright ARE needed - run-smoke.sh
      # drives the built image with a host-side Playwright suite.
      - name: Set up Node.js
        if: steps.gate.outputs.selected != ''
        uses: actions/setup-node@v7.0.0
        with:
          node-version: '26.8.2'

      - name: Cache Playwright browsers
        id: playwright-cache
        if: steps.gate.outputs.selected != ''
        uses: actions/cache@v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('tests/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-playwright-

      - name: Install smoke dependencies and browsers
        if: steps.gate.outputs.selected != ''
        working-directory: tests
        run: |
          npm ci
          if [ "${{ steps.playwright-cache.outputs.cache-hit }}" = "true" ]; then
            npx playwright install-deps chromium
          else
            npx playwright install --with-deps chromium
          fi

      # Cache Grype's vulnerability DB across runs. Locally the wrapper persists it in a named Docker volume
      # (diurnal-grype-db); a fresh runner has no such volume, so Grype re-downloads the whole DB every run
      # (3-5m). We point GRYPE_DB_CACHE_VOLUME at an absolute host path below so the `docker run -v` becomes
      # a bind mount into this cached directory instead of a named volume. The DB updates ~daily, so the key
      # is the DAY and the restore-keys prefix falls back to the most recent previous day - Grype then pulls
      # only the delta.
      #
      # THE KEY MUST NOT BE UNIQUE PER RUN. It was `github.run_id`, which never matches an existing entry, so
      # actions/cache SAVED a fresh entry on every single run. A repository's total cache budget is 10GB with
      # LRU eviction, and that one mistake had put 2.5GB of orphaned entries into it - which then evicted the
      # caches that do pay for themselves, the Qodana index above all (~10m cold against ~2m30s warm). A date
      # key writes at most one entry a day. The same mistake, in a third-party action, is why the Maven cache
      # in `gate-build` is keyed by hand rather than left to s4u/setup-maven-action.
      - name: Resolve today's date for the Grype cache key
        id: grype_day
        if: steps.gate.outputs.selected != ''
        run: |
          day="$(date -u +%F)"
          echo "day=${day}" >> "${GITHUB_OUTPUT}"

      - name: Cache Grype vulnerability DB
        if: steps.gate.outputs.selected != ''
        uses: actions/cache@v6.1.0
        with:
          path: ~/.cache/grype-db
          key: ${{ runner.os }}-grype-db-${{ steps.grype_day.outputs.day }}
          restore-keys: |
            ${{ runner.os }}-grype-db-

      - name: Run the deployment-smoke suite and the image scan
        if: steps.gate.outputs.selected != ''
        env:
          # Absolute path => the wrapper's `docker run -v` bind-mounts this cached dir as Grype's DB
          # cache (instead of the default named volume), so the actions/cache step above persists it.
          GRYPE_DB_CACHE_VOLUME: /home/runner/.cache/grype-db
          GATE_FAILURE_TAIL_LINES: "150"
          GATE_SELECTED: ${{ steps.gate.outputs.selected }}
        run: .github/scripts/lint_and_tests.sh "${GATE_SELECTED}" -v -e

      # The Grype scanner runs as root, so the cached DB files are root-owned; hand them back to the
      # runner user so actions/cache's post-job tar can read them when saving. `always()` so the cache
      # is still saved (and the next run stays warm) even if the scan above failed.
      - name: Fix Grype DB cache ownership
        if: always()
        run: sudo chown -R "$USER" /home/runner/.cache/grype-db || true

  gate-qodana:
    name: Gate - whole-program analysis
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read

    steps:
      # submodules: the Qodana inspection profile and the IDE overrides live in code-quality-config, and are
      # hashed into the cache key below - without them they would hash to nothing and every submodule bump
      # would silently reuse a stale index.
      - name: Checkout repository
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          submodules: true

      - name: Resolve the steps this job owns
        id: gate
        env:
          # Via the environment rather than interpolated straight into the script: a `${{ }}` expansion is
          # pasted in as TEXT before bash ever sees the line, so a dispatch input containing a quote would
          # otherwise end the argument and run whatever followed it.
          GATE_STEPS: ${{ inputs.gate-steps || 'docker,java' }}
        run: |
          set -euo pipefail
          selected="$(.github/scripts/gate_job_steps.sh "${GATE_STEPS}" 'java:qodana')"
          echo "selected=${selected}" >> "${GITHUB_OUTPUT}"
          echo "Running: ${selected:-<nothing - not selected by gate-steps>}"

      # Maven is here for ONE artifact, not to build anything: qodana_parent_guard refuses to start the scan
      # unless the parent POM can be found, because without it there is no effective POM, no classpath, and
      # the scan reports thousands of false "unused" findings instead of failing. `mvn -N validate` is what
      # that guard's own message recommends - it resolves the parent into ~/.m2 and nothing else, so there is
      # no repository worth caching here (cache-enabled is off for the same reason it is off in gate-build).
      - name: Setup Maven Action
        if: steps.gate.outputs.selected != ''
        uses: s4u/setup-maven-action@v1.21.0
        with:
          checkout-enabled: false
          cache-enabled: false
          java-distribution: 'temurin'
          java-version: '26'
          maven-version: '3.9.16'

      - name: Seed the parent POM for the scan's resolution guard
        if: steps.gate.outputs.selected != ''
        run: mvn -N validate

      # Cache Qodana's IntelliJ index, its downloaded JBR and the Maven repository it resolves into. A cold
      # scan builds the whole index from scratch and pulls the JBR before it inspects a single file, which
      # is the bulk of the step's wall clock on a shared runner.
      #
      # ONLY .qodana/cache is cached - NEVER .qodana/results, which is where the SARIF lands. That is not an
      # oversight: the gate is judged fresh on every run and deliberately keeps no baseline (see the "NO
      # BASELINE" note in code-quality-config-overrides/qodana.yaml), so restoring a previous run's
      # findings would let a finding be inherited into a silently-accepted set - exactly what the
      # no-baseline policy exists to prevent.
      #
      # Keyed on everything that decides what a cached index means: the pinned linter image (in
      # code-quality-config-overrides/qodana.yaml), the inspection profile, the IDE overrides, and the POM.
      # A run whose key already exists restores and does NOT re-upload, so one entry is reused rather than a
      # new one written every run.
      #
      # There is deliberately NO `restore-keys` fallback, unlike the Grype step above. A cache written
      # before ExternalStorageConfigurationManager was dropped from the overrides carries a module model
      # that lives outside `.idea`, and restoring it makes every run fail with "This project contains no
      # modules" - a green pipeline turning red with no code change. A prefix fallback would reach exactly
      # those entries. Without one, a change to any keyed file simply starts cold once (~10m instead of
      # ~2m30s) and is warm from then on, which is the right way round for a gate.
      #
      # THE POM IS HASHED WITH ITS OWN <version> REDACTED, which is why this is a hand-rolled sha256 and
      # not a second `hashFiles(...)` argument. bump_version.sh rewrites that element to the next
      # -SNAPSHOT and commits it at the end of EVERY release, so the pom is guaranteed to differ from the
      # one the previous release cached against - hashing the file as-is meant the key never matched on a
      # release run, and every release paid the full cold ~10m scan AND left another ~420MB orphan in the
      # 10GB budget (seven of them accumulated in a single day before this was fixed). Nothing the scan
      # indexes depends on this project's own version string. Everything that genuinely changes the index
      # still changes the key: the awk below blanks only the FIRST <version> after </parent>, so the
      # parent-pom version, every dependency and the whole plugin configuration are still hashed.
      - name: Resolve the Qodana cache key
        id: qodana_key
        if: steps.gate.outputs.selected != ''
        run: |
          # -euo pipefail is explicit: the Actions default shell is `bash -e` WITHOUT pipefail, so a
          # missing submodule file would otherwise let `cat` fail inside the pipeline and still hash the
          # partial input into a plausible-looking key - silently reusing a stale index, which is the
          # exact failure the submodule note above exists to prevent. Fail loudly instead.
          set -euo pipefail
          {
            awk 'BEGIN{done=0} /<\/parent>/{inproj=1} inproj && !done && /<version>/{sub(/<version>[^<]*<\/version>/,"<version>PROJECT</version>"); done=1} {print}' pom.xml
            cat code-quality-config-overrides/qodana.yaml
            cat code-quality-config/java/qodana/profiles/java.yaml
            find code-quality-config/java/qodana/overrides -type f -print0 | sort -z | xargs -0 cat
          } | sha256sum | cut -d' ' -f1 | sed 's/^/key=/' >> "${GITHUB_OUTPUT}"

      - name: Cache Qodana index
        if: steps.gate.outputs.selected != ''
        uses: actions/cache@v6.1.0
        with:
          path: .qodana/cache
          key: ${{ runner.os }}-qodana-${{ steps.qodana_key.outputs.key }}

      - name: Run the whole-program analysis
        if: steps.gate.outputs.selected != ''
        env:
          GATE_FAILURE_TAIL_LINES: "150"
          GATE_SELECTED: ${{ steps.gate.outputs.selected }}
        run: .github/scripts/lint_and_tests.sh "${GATE_SELECTED}" -v -e

  # The k6 performance/load suite, run BESIDE the gate rather than serially after it.
  #
  # Inside lint_and_tests.sh `perf` deliberately runs last and alone, because it MEASURES the application
  # and anything sharing the box distorts the numbers into queue time. A separate GitHub job is a separate
  # VM, so that isolation is preserved exactly - the suite still has a whole runner to itself, of the same
  # spec - which is why every budget below carries over unchanged from when it ran inside `test`. What is
  # no longer paid is its wall clock: it used to be minutes of pure tail on the release's critical path.
  #
  # It needs nothing from `test`: tests/docker-compose.perf.yml builds the production image from the
  # Dockerfile itself, so there is no Maven, no Node and no target/ to inherit. That build is cold here
  # where the combined job got it as a layer-cache hit off the smoke tier - paid in parallel, against a
  # `test` job that runs far longer, so it stays free.
  #
  # This job always SUCCEEDS rather than being skipped when the suite is not selected (see the step
  # below), which is deliberate: `publish` needs it, and GitHub skips a job whose dependency was skipped.
  # A plain `if:` here would therefore silently cancel the release on the very runs the suite is skipped -
  # the common case. Costing one runner start-up keeps `publish`'s gating exactly as it was.
  perf:
    name: Performance suite
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read

    steps:
      # fetch-depth 0 is for the TAGS, not the history: the auto-detection below diffs against the most
      # recent semver tag, and on a shallow clone it finds none - whereupon it reports that it is
      # "running all steps", and the suite runs on every single push. Fail-open is the right default
      # inside the script; here it would quietly undo the point of this job.
      - name: Checkout repository
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      # Printed rather than assumed. Every budget below is calibrated against a specific core count, and
      # the standard runner has been resized before (public repositories moved from 2 vCPU to 4), which
      # silently halves the strictness of a tolerance tuned for the older box. Two seconds here means the
      # next recalibration starts from a measurement instead of a guess.
      - name: Record the runner size
        run: |
          # Each substitution is assigned on its own line so shellcheck (SC2312) does not flag a masked
          # return value - the same convention lint_and_tests.sh follows.
          cpus="$(nproc)"
          memory="$(free -h | awk '/^Mem:/ {print $2}')"
          disk="$(df -h / | awk 'NR==2 {print $4}')"
          echo "vCPUs:  ${cpus}"
          echo "Memory: ${memory}"
          echo "Disk:   ${disk} free"

      # Perf-tier calibration for the GitHub runner, which runs the app, Postgres AND the k6 generator on
      # the same cores - so the dev-workstation load-shape drives it into queueing collapse (p95s of
      # seconds that are pure queue time, not service time). Offer a lighter load so we measure service
      # time, and widen the latency budget with PERF_P95_TOLERANCE - while the error-rate budgets stay
      # strict, so a genuinely broken path still fails. These are forwarded through lint_and_tests.sh ->
      # run-perf.sh into the k6 container.
      #
      # RECALIBRATED for a 4-vCPU / 16GB runner. These numbers were originally chosen for a 2-vCPU box,
      # which is what the standard public-repository runner used to be; it is now 4 vCPU, and a budget
      # tuned for half the cores is not a neutral leftover - it is a gate that has quietly stopped
      # catching things. Roughly twice the CPU roughly halves service time, so PERF_P95_TOLERANCE halves
      # with it (8 -> 4) and PERF_DROPPED_MAX with it (50 -> 25). That is deliberately a RE-EXPRESSION of
      # the original strictness on the bigger box rather than a new policy.
      #
      # PERF_RATE and PERF_VUS are deliberately NOT raised in the same change. Offered load pushes latency
      # UP while the extra cores push it DOWN, so moving both at once makes a red run uninterpretable;
      # moving one leaves an unambiguous cause. Raising PERF_RATE towards the local default of 20 is the
      # natural follow-up once one run has established a baseline - read the measured p95s out of this
      # job's output and the "Record the runner size" step above.
      #
      # THE SUITE IS RUN ONLY IF AUTO-DETECTION SELECTS IT, and the script is asked rather than second-guessed.
      # `perf` triggers on the same file set as `java` (anything feeding the runtime, the app
      # code or the dependencies) plus the suite's own files, with java's comment-only and version-bump
      # suppression applied - rules that live in detect_changed_steps and nowhere else. Restating them in
      # an `if:` here would be a second copy free to drift; `--list-steps` reports the real verdict.
      # `grep -qx` so a scoped entry can never match on a substring.
      - name: Run the performance suite if auto-detection selects it
        env:
          PERF_RATE: "5"
          PERF_VUS: "10"
          PERF_P95_TOLERANCE: "4"
          # The runner shares its cores with the app, Postgres and k6, so the generator itself can miss
          # its schedule. Allow a few dropped iterations rather than 0 (the local default), while still
          # failing on a collapse in offered load.
          PERF_DROPPED_MAX: "25"
          # Not a perf knob: how much of the failing tier's log the wrapper re-prints before its summary.
          # Wider than the local default of 40 because this excerpt is all a red run leaves behind - the
          # logs live in the runner's /tmp and die with the job.
          GATE_FAILURE_TAIL_LINES: "150"
        run: |
          # The detection is run into a VARIABLE rather than straight down a pipe into grep, so that the
          # two ways of not running the suite stay distinguishable. Piped, a script that failed outright
          # would hand grep an empty stdin, grep would report no match, and the step would quietly take
          # the "not selected" branch - skipping a release gate because the thing that decides was
          # broken. Assigned under `set -e`, that failure kills the step instead, which is what a gate
          # whose selector is broken should do. (-euo pipefail is explicit because the Actions default
          # shell is `bash -e` WITHOUT pipefail.)
          set -euo pipefail
          selected="$(.github/scripts/lint_and_tests.sh --list-steps)"
          if grep -qx 'perf' <<<"${selected}"; then
            .github/scripts/lint_and_tests.sh perf -v -e
          else
            echo "Auto-detection did not select 'perf': nothing in this release changes what the suite"
            echo "measures (the runtime image, the app code, the dependencies, or the suite itself), so"
            echo "running it would re-measure an unchanged application. Skipped."
            echo "Steps it did select: ${selected//$'\n'/, }"
          fi

  # The preview-generation image build, verified in PARALLEL with the gate instead of inside `publish`.
  #
  # The gate builds the runtime image twice (the smoke tier and the grype scan) but BOTH pass
  # GENERATE_PREVIEWS=false, so the preview-generation stage - an extra Quarkus build plus Postgres and
  # Chromium, inside the image build - is exercised by no test tier at all. The published image takes the
  # default, GENERATE_PREVIEWS=true, so without this job the push would be the first and only time that
  # stage is ever built. Building it here fails on the stage itself, with nothing pushed and no tag
  # created - `publish` needs this job, so a failure stops the release exactly as it did when this was a
  # step inside it.
  #
  # It used to BE that step, and cost 5m15s of the release's critical path for a build with no outward
  # effect. It shares nothing with the gate, so it does not belong behind it.
  #
  # `cache-to` is what makes the split pay: the layers are handed to `publish`'s runner through the
  # registry cache rather than a local buildx cache that a separate job cannot see. Writing it for a
  # commit whose gate then fails is harmless - this ref is a layer cache, never a released tag.
  preview:
    name: Verify the preview image build
    needs: version
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      VERSION: ${{ needs.version.outputs.version }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      # cache-enabled: see the note in `gate-build`. This job runs `mvn versions:set` alone, so it has no
      # repository worth caching, and the action's pom-hash key changed on every release anyway.
      - name: Setup Maven Action
        uses: s4u/setup-maven-action@v1.21.0
        with:
          checkout-enabled: false
          cache-enabled: false
          java-distribution: 'temurin'
          java-version: '26'
          maven-version: '3.9.16'

      # LOAD-BEARING, and the reason Maven is set up in a job that only builds an image. `publish` runs
      # this same command before its own build, and the Dockerfile COPYs pom.xml into both the
      # `previewbuild` and `build` stages - so a pom differing by one byte misses the cache at that COPY
      # and `publish` rebuilds from scratch everything this job just built. The two must produce a
      # byte-identical pom. Move this and you silently undo the whole saving.
      - name: Set Maven version from VERSION file
        run: mvn versions:set -DnewVersion="${VERSION}" -DgenerateBackupPoms=false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.3.0

      # Needed for `cache-to` below - writing the registry cache is an authenticated push.
      - name: Log in to Docker Hub
        uses: docker/login-action@v4.6.0
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # DOC_SCREENSHOTS=true matches the value `publish` passes on its push AND on its screenshot export -
      # the same value on all three on purpose. A build arg is part of the stage's cache key, so a build
      # passing a different value re-runs the whole Postgres + Chromium + app-boot stage instead of hitting
      # the cache. One execution here then serves the published image and the exported README screenshots.
      - name: Verify the preview-generation image build
        uses: docker/build-push-action@v7.3.0
        with:
          context: .
          file: ./Dockerfile
          push: false
          build-args: |
            GENERATE_PREVIEWS=true
            DOC_SCREENSHOTS=true
          cache-from: type=registry,ref=zodac/diurnal:cache
          cache-to: type=registry,ref=zodac/diurnal:cache,mode=max

  # Tag the release, build and push the Docker image, publish a GitHub Release and bump the patch
  # version for the next cycle. Runs once the gate, the translation check, the performance suite and the
  # preview image build are all green.
  publish:
    name: Publish release
    needs: [ version, translations, gate-build, gate-image, gate-qodana, perf, preview ]
    # Every irreversible act of the release lives in this job, which is what lets the one condition that
    # decides whether to release be expressed as a single `if:` rather than threaded through the steps.
    # Switching this job off is the whole of the dry run.
    #
    # Reads as: a push always releases; a dispatch releases unless dry-run asked it not to. The event-name
    # test has to come FIRST and short-circuit, because `inputs` is null on a push - and it is spelled
    # `== 'push'` rather than `!= 'workflow_dispatch'` so that adding a third trigger someday has to make
    # a deliberate decision here instead of silently inheriting "releases".
    #
    # `!= true` rather than `== false` on dry-run, because on the paths where `inputs` exists but the field
    # was left alone it is neither.
    if: ${{ github.event_name == 'push' || inputs.dry-run != true }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write # push the version-bump commit + release tag, create the GitHub Release
    env:
      VERSION: ${{ needs.version.outputs.version }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0 # need full history + tags for the changelog and tagging

      - name: Fetch tags
        run: git fetch --tags

      - name: Configure git user
        run: |
          git config user.name "publisher"
          git config user.email "github-actions@github.com"

      # Maven is needed by the version-bump step (bump_version.sh), which runs `mvn versions:set` on
      # every release. Pinning it here (rather than relying on the runner's pre-installed Maven) keeps
      # the toolchain consistent with the `test` job.
      # cache-enabled: this job runs `mvn versions:set` and nothing else, so it resolves a handful of POMs
      # and has no repository worth a ~440MB cache entry. Left on, the action wrote one every run under a
      # key ending in hashFiles('**/pom.xml') that a release always changes - see the note in `gate-build`.
      - name: Setup Maven Action
        uses: s4u/setup-maven-action@v1.21.0
        with:
          checkout-enabled: false
          cache-enabled: false
          java-distribution: 'temurin'
          java-version: '26'
          maven-version: '3.9.16'

      - name: Set Maven version from VERSION file
        run: mvn versions:set -DnewVersion="${VERSION}" -DgenerateBackupPoms=false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.3.0

      - name: Log in to Docker Hub
        uses: docker/login-action@v4.6.0
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # DOC_SCREENSHOTS=true is passed on the push below, on the screenshot export, AND on the `preview`
      # job's verification build - the same value on all three on purpose. A build arg is part of the
      # stage's cache key, so a build passing a different value would re-run the whole Postgres + Chromium
      # + app-boot stage instead of hitting the cache. One execution then serves the published image and
      # the exported README screenshots both.
      #
      # org.opencontainers.image.created must be RFC 3339, and must be resolved here rather than inside
      # the build - a Dockerfile cannot read the clock.
      - name: Resolve the image build date
        id: build_date
        run: echo "build_date=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> "${GITHUB_OUTPUT}"

      # The three build-args feed the OCI labels on the runtime stage (see the end of the Dockerfile) and
      # nothing else. They are consumed by a LABEL, which writes no filesystem layer, so a new revision
      # and build date every release changes only the image config - the registry cache above is still a
      # full hit and no layer is re-pushed. Only THIS build passes them: the `preview` job's verification
      # build is thrown away, and leaving it unlabelled keeps its (identical) layers reusable here.
      - name: Build and push Docker image
        uses: docker/build-push-action@v7.3.0
        with:
          context: .
          file: ./Dockerfile
          push: true
          build-args: |
            BUILD_DATE=${{ steps.build_date.outputs.build_date }}
            GIT_REVISION=${{ github.sha }}
            VERSION=${{ env.VERSION }}
            GENERATE_PREVIEWS=true
            DOC_SCREENSHOTS=true
          cache-from: type=registry,ref=zodac/diurnal:cache
          cache-to: type=registry,ref=zodac/diurnal:cache,mode=max
          tags: |
            zodac/diurnal:${{ env.VERSION }}
            zodac/diurnal:latest

      # Pull the freshly-captured README screenshots out of the image build (the `docscreenshots` stage is
      # FROM scratch, so the export is the WebP files plus buildx's own provenance.json, which the `*.webp`
      # glob in the upload step at the end of this job leaves behind). They land in docs/screenshots, which
      # is gitignored, so nothing exported here can ride along on the version-bump commit.
      #
      # THIS MUST RUN BEFORE `bump_version.sh`, which is the whole reason it sits here rather than beside
      # the upload step that consumes it. That script rewrites VERSION (to the NEXT patch) and pom.xml (to
      # the matching -SNAPSHOT) in the working tree, and the Dockerfile COPYs both into `previewbuild` - so
      # a build run after it misses the cache at that COPY, rebuilds the fast-jar, and boots an app whose
      # footer reads the packaged VERSION resource as the version AFTER this release. Every screenshot
      # shipped for 1.0.6 would read 1.0.7. Run here, against the same context the two builds above used,
      # the expensive Postgres + Chromium `screenshots` stage is a cache hit and the footer in the captured
      # pixels is the released version.
      - name: Export the README screenshots from the image build
        uses: docker/build-push-action@v7.3.0
        with:
          context: .
          file: ./Dockerfile
          target: docscreenshots
          build-args: |
            GENERATE_PREVIEWS=true
            DOC_SCREENSHOTS=true
          outputs: type=local,dest=docs/screenshots
          cache-from: type=registry,ref=zodac/diurnal:cache

      - name: Get previous tag
        id: prev_tag
        run: |
          # Latest existing VERSION tag (empty on the very first release; the changelog script handles
          # that). --match is load-bearing: the standalone `readme-assets` asset-host release carries a git
          # tag of that name on the branch tip, which an unfiltered describe returns in preference to the
          # release tags - silently generating every later changelog from the wrong range.
          prev_tag="$(git describe --tags --abbrev=0 --match='[0-9]*' 2>/dev/null || true)"
          echo "prev_tag=${prev_tag}" >> "${GITHUB_OUTPUT}"

      - name: Generate categorised changelog
        run: .github/scripts/generate_changelog.sh "${{ steps.prev_tag.outputs.prev_tag }}"

      # Assemble the release body: optional RELEASE_NOTES.md (if non-empty) + Docker pull line +
      # the categorised changelog (exported as env.changelog_content by the step above). Exposed as
      # steps.release_body.outputs.body for the Create GitHub Release step.
      - name: Build release body
        id: release_body
        env:
          CHANGELOG_CONTENT: ${{ env.changelog_content }}
        run: .github/scripts/generate_github_release_content.sh "${VERSION}" "${{ steps.prev_tag.outputs.prev_tag }}"

      - name: Tag the released version
        run: git tag "${VERSION}"

      # The Quick Start tells a user to download this file and run it, so the tag it names has to be a release
      # that actually exists - it is pinned rather than :latest so an upgrade is deliberate (a MAJOR bump can
      # break a deployment; see README.md's Versioning section). Rewritten here, after the push above has put
      # that tag on Docker Hub, so the file on master never names a version nobody can pull. Staged, not
      # committed: bump_version.sh below commits the whole index.
      - name: Pin the example Compose file to the released version
        run: |
          sed -i -E "s|^(\s*image: zodac/diurnal:).*|\1${VERSION}|" docs/docker-compose.example.yml
          git add -- docs/docker-compose.example.yml
          grep -n 'image: zodac/diurnal:' docs/docker-compose.example.yml

      - name: Bump patch version in VERSION file for the next cycle
        run: .github/scripts/bump_version.sh "${VERSION}"

      - name: Push version-bump commit and release tag
        uses: ad-m/github-push-action@v1.3.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          branch: master
          tags: true

      - name: Create GitHub Release
        uses: ncipollo/release-action@v1.21.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          name: v${{ env.VERSION }}
          tag: ${{ env.VERSION }}
          body: ${{ steps.release_body.outputs.body }}
          # Every publish is a full release: never flagged as a pre-release, always marked "Latest".
          prerelease: false
          makeLatest: true

      # Replace the assets on the standalone `readme-assets` release in place, with the screenshots the
      # export step above pulled out of the image build (the `*.webp` glob leaves buildx's own
      # provenance.json behind).
      #
      # That release is an ASSET HOST, not a software release: it carries no version, is never marked
      # Latest, and --clobber overwrites its assets, so exactly ONE set of screenshots exists no matter how
      # many releases are cut. That is what lets README.md and docs/dockerhub-overview.md embed a permanent
      # URL - `releases/download/readme-assets/<name>.webp` - that never needs rewriting. Pinning them to a
      # version tag instead would mean editing 19 URLs on every refresh; `releases/latest/download` would
      # break every image the moment a release shipped without them.
      #
      # THIS DESIGN REQUIRES THE REPOSITORY'S "Immutable releases" SETTING TO STAY OFF. A release published
      # while it is on is frozen - its assets can never be --clobbered - and, worse, its tag name is
      # reserved FOREVER: deleting the release does not free the name, and turning the setting back off does
      # not either. Every later `gh release create <that name>` then fails with `Cannot create ref due to
      # creations being restricted` / `tag_name was used by an immutable release`. That is exactly how the
      # previous asset host, tagged `screenshots`, was lost - that name is permanently unusable on this
      # repository, which is why this one is `readme-assets`. If the setting is ever turned on, move the
      # screenshots onto the version release (attached via the release action's `artifacts:`, since an
      # immutable release accepts no upload after publication) rather than burning a third tag name here.
      #
      # Created on first use, so this needs no manual setup on a fresh fork. It is deliberately NOT
      # continue-on-error - a silently stale README is exactly the drift this step exists to remove - but
      # it is the half of the screenshot flow that acts OUTWARDS, so it stays here, after the release
      # above: a failure uploading assets cannot strand a half-published release. Only the export had to
      # move earlier, and it writes nothing but local files.
      - name: Refresh the screenshot release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ls -la docs/screenshots/
          if ! gh release view readme-assets >/dev/null 2>&1; then
            gh release create readme-assets \
              --title 'README assets' \
              --latest=false \
              --notes 'Asset host for the screenshots embedded in README.md and the Docker Hub overview. Not a software release; its assets are replaced on every release.'
          fi
          gh release upload readme-assets --clobber docs/screenshots/*.webp

      # Push the Docker Hub "Repository overview" from docs/dockerhub-overview.md. That file exists rather
      # than pointing this at README.md because Docker Hub resolves no relative paths (the README's
      # `assets/wordmark-readme.svg` renders as a broken image there) and the field sanitises the README's
      # inline `<p align="center">`/`width=` HTML away. The overview file is the same content written in
      # absolute-URL, no-HTML form. The SCREENSHOTS in both files are now the same absolute URLs - assets on
      # the standalone `readme-assets` release - so only the wordmark still needs a per-file form.
      #
      # short-description mirrors `org.opencontainers.image.description` in the Dockerfile - the same sentence
      # in the two places a user meets it, the image's own metadata and the Hub listing. It is a SECOND COPY of
      # that string, so the two drift unless both move together. Docker Hub HARD-CAPS this field at 100
      # characters and the sentence is 98, so there is room for two more and no more: a longer label cannot
      # simply be pasted across.
      #
      # LAST on purpose. The description is cosmetic, but this step is the one most likely to fail
      # (see the scope note below) - and every irreversible act of the release is already done by this point:
      # the image is pushed, the tag and version-bump commit are pushed, the GitHub Release exists. Run any
      # earlier, a credential failure here would strand a half-published release with an image on Docker Hub
      # and no tag behind it. It is deliberately NOT continue-on-error: a stale overview should show up as a
      # red run rather than be swallowed, and by here a red run costs nothing but the notification.
      #
      # SCOPE: this action calls the Docker Hub API, which needs a password or a PAT with read/write/DELETE
      # scope - strictly more than the read/write `docker/login-action` above gets by on. If this step 401s
      # or 403s, that is why, and DOCKERHUB_TOKEN needs regenerating with the wider scope rather than being
      # debugged here. Observed once for real on the v1.0.1 release: `Sending PATCH request / Error:
      # Forbidden`, with every preceding step - including the image push on the same API token - green.
      - name: Update the Docker Hub repository overview
        uses: peter-evans/dockerhub-description@v5.0.0
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: zodac/diurnal
          readme-filepath: ./docs/dockerhub-overview.md
          short-description: 'Self-hosted application for tracking daily habits, with calendar views, statistics and daily notes'

      - name: Summary
        run: |
          echo "Created GitHub release for version: ${VERSION}"
          echo "Published Docker image. Pull it using:"
          echo "  docker pull zodac/diurnal:${VERSION}"
