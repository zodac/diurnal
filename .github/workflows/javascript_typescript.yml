name: JavaScript & TypeScript CI

on:
  push:
    branches: [ master ]
    paths:
      - '.github/workflows/javascript_typescript.yml'
      # JavaScript sources linted by the `javascript` step. The served app scripts are the bulk of them
      # (the step lints every tracked *.js/*.cjs), so leaving them out meant a change to dashboard.js or
      # app.js was linted in CI only by the monthly full-gate run.
      - 'src/main/resources/META-INF/resources/js/**'
      - 'frontend/tailwind.config.js'
      - 'scripts/**/*.cjs'
      # A submodule bump changes both eslint configs; it is reported as this bare gitlink path.
      - 'code-quality-config'
      # TypeScript sources linted by the `typescript` step
      - 'tests/**/*.ts'
      - 'tests/tsconfig.json'
      - 'tests/package.json'
      - 'tests/package-lock.json'
  workflow_dispatch: # allows manual trigger

jobs:
  analyze:
    name: JavaScript & TypeScript Analysis
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      # submodules: the code-quality-config submodule holds the shared eslint configs
      - name: Checkout repository
        uses: actions/checkout@v7.0.1
        with:
          submodules: true

      - name: Lint JavaScript and TypeScript with ESLint
        run: .github/scripts/lint_and_tests.sh javascript,typescript -v
