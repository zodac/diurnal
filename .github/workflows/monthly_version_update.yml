name: Monthly Dependency and Submodule Update

on:
  schedule:
    # Runs on the 1st of every month at 03:00 UTC
    - cron: "0 3 1 * *"
  workflow_dispatch: # allows manual trigger

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: write
      security-events: write
    env:
      has_changes: "false"

    steps:
      # Mint a short-lived installation token from the org-owned GitHub App
      # This token carries `workflows: write`, which the default GITHUB_TOKEN lacks
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v3.2.0
        with:
          client-id: ${{ secrets.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}

      - name: Checkout repository (with submodules)
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0 # Needed for pushing tags
          submodules: true
          token: ${{ steps.app-token.outputs.token }}

      - name: Fetch tags
        run: git fetch --tags

      - name: Configure git user
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

      # Only the wrapper's `java` step runs on the host toolchain (Maven drives the CSS build and the
      # managed IT database itself); docker/javascript/typescript/markdown/shellcheck/perf all run
      # inside pinned Docker images, so they need nothing installed here. Hence: JDK+Maven, Node, and the
      # two npm installs below - and nothing else.
      - name: Cache local .m2
        uses: actions/cache@v6.1.0
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: Setup Maven Action
        uses: s4u/setup-maven-action@v1.20.0
        with:
          checkout-fetch-depth: 0
          java-distribution: "temurin"
          java-version: "26"
          maven-version: "3.9.16"

      - name: Set up Node.js
        uses: actions/setup-node@v7.0.0
        with:
          node-version: '26.7.0'

      - name: Update all dependency versions
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
        run: ./.github/scripts/update_dependency_versions.sh

      # Installed AFTER the update step so the refreshed lockfiles are the ones exercised. frontend/ backs
      # the POM's css-build + vendor-assets execs; tests/ backs the E2E and deployment-smoke tiers, whose
      # runners install the Chromium build they pin themselves - only the OS-level libs it needs are
      # pulled here (`install-deps`), since those are what a bare runner lacks.
      - name: Install CSS build dependencies
        working-directory: frontend
        run: npm ci

      - name: Install E2E dependencies and browser OS libraries
        working-directory: tests
        run: |
          npm ci
          npx playwright install-deps chromium

      # -f runs every step whole (docker - both its hadolint and grype tiers - java, javascript, markdown,
      # perf, shellcheck, typescript), so a monthly bump to a Dockerfile pin, an npm/eslint dep or a
      # shell/markdown tool is tested too - not just the Java side.
      - name: Run all lints and tests
        # Perf-tier calibration for the shared 2-vCPU GitHub runner, mirroring publish.yml: offer a lighter
        # load and widen the latency budget so we measure service time rather than queueing, while the
        # error-rate budgets stay strict. Only the `perf` step reads these.
        env:
          PERF_RATE: "5"
          PERF_VUS: "10"
          PERF_P95_TOLERANCE: "8"
          # The 2-vCPU runner shares its cores with the app, Postgres and k6, so the generator
          # itself can miss its schedule. Allow a few dropped iterations rather than 0 (the
          # local default), while still failing on a collapse in offered load.
          PERF_DROPPED_MAX: "50"
        run: .github/scripts/lint_and_tests.sh -f -v

      - name: Check for changes
        id: detect_changes
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git add -A
            echo "has_changes=true" >> $GITHUB_ENV
          fi

      - name: Commit changes
        id: change_commit
        if: env.has_changes == 'true'
        run: git commit -m '[CI] Updating versions'

      - name: Push changes
        if: env.has_changes == 'true'
        uses: ad-m/github-push-action@v1.3.0
        with:
          branch: master
          github_token: ${{ steps.app-token.outputs.token }}
