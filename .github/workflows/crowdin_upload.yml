name: Crowdin Upload CI

# Pushes the repo's translated bundles BACK to Crowdin, which the GitHub integration alone cannot do
# correctly: a translation whose text is identical to the source string is silently discarded on import
# unless the upload asks for it, and that option (`--import-eq-suggestions`) is a per-upload flag rather
# than a project setting the integration can be told about. en-US is 392-of-404 identical to the en-GB
# source - only the twelve `colour`->`color`/`authorised`->`authorized` entries actually differ - so
# without this every sync leaves it as hundreds of untranslated strings, and an export configured
# to skip untranslated strings would drop those keys from the file outright (which
# AppMessageCoverageTest#everyBundleKey_isTranslatedWithNoOrphans then fails the Crowdin PR on).
#
# Direction is deliberately one-way: this job ONLY uploads. Downloads and the PRs they arrive on remain
# the GitHub integration's job. Sources go up HERE TOO (upload_sources: true) rather than being left to
# the integration, because splitting the two across two systems loses a translation every time a source
# string is REWORDED: this job fires within seconds of the push, the integration syncs the source file on
# its own cadence well after that, and Crowdin drops the translations of any string whose source text has
# changed - so the translation uploaded here against the OLD source is discarded minutes later, silently,
# long after this job reported success. Uploading both in one CLI invocation orders them correctly:
# sources first, then the translations against those same sources. The CLI writes to the very file the
# integration syncs to (`master > translations > msg_en-GB.properties`; preserve_hierarchy in crowdin.yml
# is what keeps the two paths identical), so it updates that file rather than adding a second copy of it -
# re-confirm with the workflow_dispatch dryrun input after any change to the config or the layout.
#
# The path filter is what makes re-uploading safe rather than destructive. An upload REPLACES whatever
# Crowdin holds for those strings, so it must never run while Crowdin is ahead of the repo - which is
# also what rules out putting this job on a schedule, however tempting a periodic re-upload is as a way
# of healing a bad one. These files change in exactly two situations - a Crowdin download PR merging
# (after which the two are identical, so the upload is a no-op except for the equal-to-source strings
# Crowdin dropped, which is the entire point) and a hand edit in this repo (which is the one case where
# the repo IS the newer side). The source file is in the filter alongside the bundles because a reworded
# source string can land with no bundle changing at all, and that is precisely the commit that must not
# be missed.
on:
  push:
    branches: [ master ]
    paths:
      - '.github/workflows/crowdin_upload.yml'
      - 'crowdin.yml'
      - 'src/main/resources/messages/**'
      - 'translations/**'
  workflow_dispatch:
    inputs:
      dryrun:
        description: 'Dry Run: List the files that would be managed, without uploading anything'
        type: boolean
        default: false

jobs:
  upload:
    name: Upload Translations to Crowdin
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      # No submodules: this job runs no part of the quality gate, only the Crowdin CLI over the bundles.
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      # A secret that never reached the runner is indistinguishable, at the CLI, from a wrong one: both come
      # back as "Couldn't authorize. Check your 'api_token'". An ORGANISATION secret silently resolves to the
      # empty string whenever its repository access policy excludes this repo - which "Private repositories"
      # does, since zodac/diurnal is public - so the failure looks like a bad token and is not one. Report
      # which of the two it actually is. Lengths only: the values themselves are masked in the log anyway,
      # and a length is what catches a truncated or newline-padded paste.
      - name: Verify the Crowdin credentials reached the runner
        env:
          CROWDIN_PROJECT_ID: ${{ secrets.CROWDIN_PROJECT_ID }}
          CROWDIN_PERSONAL_TOKEN: ${{ secrets.CROWDIN_PERSONAL_TOKEN }}
        run: |
          missing=0
          if [ -z "${CROWDIN_PROJECT_ID}" ]; then
            echo "::error::CROWDIN_PROJECT_ID is empty - the secret is unset, or an organisation secret whose repository access policy excludes this public repo"
            missing=1
          else
            echo "CROWDIN_PROJECT_ID: ${#CROWDIN_PROJECT_ID} characters"
          fi
          if [ -z "${CROWDIN_PERSONAL_TOKEN}" ]; then
            echo "::error::CROWDIN_PERSONAL_TOKEN is empty - the secret is unset, or an organisation secret whose repository access policy excludes this public repo"
            missing=1
          else
            echo "CROWDIN_PERSONAL_TOKEN: ${#CROWDIN_PERSONAL_TOKEN} characters"
          fi
          exit "${missing}"

      # "Couldn't authorize. Check your 'api_token'" is the CLI's answer to several unrelated causes, so ask
      # the API directly and report the status code instead. Two probes, because they fail apart:
      #   /user       401 -> the token is rejected outright: expired, mistyped, or issued by an ENTERPRISE
      #                      account, which authenticates against its own organisation-specific API host
      #                      rather than the public one (the action's `base_url` input, and `api_url` here)
      #               403 -> the token is valid but lacks a scope (Projects needs at least Read)
      #   /projects   404 -> the token is fine but the project id belongs to a different account
      # Only status codes and error bodies are printed; the token travels in a header and is never echoed.
      - name: Diagnose the Crowdin credentials against the API
        env:
          CROWDIN_PROJECT_ID: ${{ secrets.CROWDIN_PROJECT_ID }}
          CROWDIN_PERSONAL_TOKEN: ${{ secrets.CROWDIN_PERSONAL_TOKEN }}
        run: |
          api='https://api.crowdin.com/api/v2'
          user_code="$(curl -s -o /tmp/crowdin-user.json -w '%{http_code}' \
            -H "Authorization: Bearer ${CROWDIN_PERSONAL_TOKEN}" "${api}/user")"
          echo "GET /user -> ${user_code}"
          [ "${user_code}" = "200" ] || head -c 400 /tmp/crowdin-user.json

          project_code="$(curl -s -o /tmp/crowdin-project.json -w '%{http_code}' \
            -H "Authorization: Bearer ${CROWDIN_PERSONAL_TOKEN}" "${api}/projects/${CROWDIN_PROJECT_ID}")"
          echo "GET /projects/<id> -> ${project_code}"
          [ "${project_code}" = "200" ] || head -c 400 /tmp/crowdin-project.json

      # crowdin.yml at the repo root supplies base_path/source/translation and the languages_mapping.
      #
      # upload_sources and upload_translations are BOTH true, and both being in this one step is the point
      # rather than an accident: the CLI uploads the source file before the translations, so the strings a
      # translation is imported against are the ones this same commit just pushed. Splitting them - either
      # into two steps or, as this job used to, across this workflow and the GitHub integration - reopens
      # the window in which Crowdin's source is older than the repo's, and every string REWORDED in the
      # push loses its translations when the source finally catches up. See the header.
      #
      # auto_approve_imported is deliberately FALSE: "translated" and "approved" are separate states, and
      # only the former is what the untranslated count above measures. Marking a string approved is a
      # review having happened, which an automated upload is not. Set it true ONLY if the project has
      # Settings -> Export -> "export only approved translations" enabled, where unapproved never ships.
      #
      # The integration scans `master` and raises its PRs from `l10n_master`. Those two names are NOT
      # interchangeable here: `l10n_master` exists only on the GitHub side, as the branch the integration
      # commits downloaded files onto, and Crowdin holds no branch by that name - never name it below.
      #
      # What matters is whether the project holds a VERSION BRANCH called `master` (the integration creates
      # one per scanned repo branch when branch mapping is on) or keeps the files at the project root. If a
      # branch exists, this step needs `crowdin_branch_name: master`; without it the upload runs against the
      # root, matches nothing, and REPORTS SUCCESS. The CrowdIn project's Sources tab settles it: a branch
      # selector above the file list means a branch exists. The workflow_dispatch dryrun input prints the
      # file list the CLI actually resolved, which is the run to trust rather than the first green one.
      - name: Upload sources and translations to Crowdin
        uses: crowdin/github-action@v3.0.2
        with:
          config: 'crowdin.yml'
          crowdin_branch_name: master
          upload_sources: true
          upload_translations: true
          import_eq_suggestions: true
          auto_approve_imported: false
          download_translations: false
          dryrun_action: ${{ inputs.dryrun || false }}
        env:
          CROWDIN_PROJECT_ID: ${{ secrets.CROWDIN_PROJECT_ID }}
          CROWDIN_PERSONAL_TOKEN: ${{ secrets.CROWDIN_PERSONAL_TOKEN }}
