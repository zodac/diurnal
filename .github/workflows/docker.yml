name: Docker CI

on:
  push:
    branches: [ master ]
    paths:
      - '.github/workflows/docker.yml'
      - 'Dockerfile'
      - 'sandbox/Dockerfile'
  workflow_dispatch: # allows manual trigger

jobs:
  analyze:
    name: Docker Analysis
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read

    steps:
      # submodules: the code-quality-config submodule holds the shared hadolint config
      - name: Checkout repository
        uses: actions/checkout@v7.0.1
        with:
          submodules: true

      # The lint TIER of the `docker` step, not the whole step: the step's other tier builds the production
      # runtime image and scans it for CVEs, which is minutes of work this job has no room (or cache) for.
      # That tier runs in the release gate (publish.yml) and the monthly bump, where the image is built anyway.
      - name: Lint Dockerfiles with Hadolint
        run: .github/scripts/lint_and_tests.sh docker:hadolint -v
