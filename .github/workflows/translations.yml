name: Translations CI

# The only workflow triggered by `pull_request` at all, and the only one watching a branch other than master,
# both deliberately: the
# translated bundles arrive as a CrowdIn-authored PR from the `l10n_master` branch, so a check that runs after
# the merge reports a break that is already on master (which is exactly how the escaped-`{\#if` corruption in
# PR #2 reached a Docker build).
#
# Deliberately UNFILTERED - no `paths:`, and no `github.head_ref == 'l10n_master'` condition - because this is a
# REQUIRED status check on master. Branch protection has no concept of a path filter: a required check that a
# filter skips never reports at all, so GitHub holds the PR at "Expected - waiting for status to be reported"
# and it can never merge. An always-reporting check is the only kind that can safely be required, and the job is
# a single unit-test class (see below), so running it on every PR costs little. Do NOT re-add a `paths:` filter
# here without first dropping the required-check rule on master.
#
# The `push` trigger on `l10n_master` is a WORKAROUND for a CAUSE THAT IS NOT YET ESTABLISHED, and is here
# because a required check that never reports leaves the PR at "Expected - waiting for status to be reported"
# forever. What is MEASURED, from the API across PRs #3-#6: a CrowdIn-opened PR produces no run on `opened`,
# and closing and REOPENING it produces none either (tried twice on #5). The only runs this workflow has ever
# had came from the `synchronize` after a web-UI "Update branch" push. Ruled out by evidence: merge conflicts
# (#5's head merged cleanly into every master tip in that window; #6 reported mergeable_state clean) and a
# missing workflow file on the head branch (dbdb973 carries it).
#
# The obvious suspect is the suppression that stops a GITHUB_TOKEN-authored PR from getting checks, CrowdIn
# raising the event through the linked account's token. It does NOT fit cleanly: the reopens were done by a
# human in a browser and were equally silent, which that suppression does not explain. The other candidate is
# the `paths:` filter this workflow carried until 3c5d78b - though a CrowdIn PR touches
# `src/main/resources/messages/**`, which was in that list, so it should have matched. Do not write either
# cause up as settled without the test below.
#
# A push-event run posts against the same head SHA branch protection reads for the PR, which is what lets this
# satisfy the check at all. Whether it fires is itself the experiment: if CrowdIn's push to `l10n_master`
# produces a run, the block is specific to the pull_request event and this holds; if it stays silent, the block
# follows the token and the fix is to stop letting the integration open the PR - raise it from CI with a PAT.
# The other half, untested here, is whether a HUMAN-opened PR runs on `opened`; that is what a future
# contributor's PR depends on, and it is worth knowing before this workaround is treated as the answer.
# Both triggers firing for one "Update branch" push is expected and harmless: two runs, same job name, same SHA.
on:
  pull_request:
    branches: [ master ]
  push:
    branches: [ l10n_master ]
  workflow_dispatch: # allows manual trigger

jobs:
  analyze:
    name: Translation Bundle Analysis
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      # No submodules needed: AppMessageCoverageTest is a plain unit test under -Dtests, and the shared lint
      # configs in code-quality-config are only read by the -Dlint/-Dall profiles this deliberately does not run.
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      - name: Setup Maven Action
        uses: s4u/setup-maven-action@v1.21.0
        with:
          checkout-fetch-depth: 0
          java-distribution: 'temurin'
          java-version: '26'
          maven-version: '3.9.16'

      # Not routed through lint_and_tests.sh: its `java` step is the full ~10-minute -Dall gate plus the E2E,
      # smoke and perf tiers, and there is no scoped step for a single unit-test class (see CLAUDE.md's
      # "Commands"). -Dcss.build.skip=true drops the POM's css-build exec, which would otherwise pull in Node
      # and the frontend/ npm install for a test that never renders a page.
      - name: Check message bundles with AppMessageCoverageTest
        run: mvn test -Dtests -Dtest=AppMessageCoverageTest -Dcss.build.skip=true
