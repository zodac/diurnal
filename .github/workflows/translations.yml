name: Translations CI

# The only workflow triggered by `pull_request` rather than by a push to master, and deliberately so: the
# translated bundles arrive as a CrowdIn-authored PR from the `l10n_master` branch, so a check that runs after
# the merge reports a break that is already on master (which is exactly how the escaped-`{\#if` corruption in
# PR #2 reached a Docker build).
#
# Deliberately UNFILTERED - no `paths:`, and no `github.head_ref == 'l10n_master'` condition - because this is a
# REQUIRED status check on master. Branch protection has no concept of a path filter: a required check that a
# filter skips never reports at all, so GitHub holds the PR at "Expected - waiting for status to be reported"
# and it can never merge. An always-reporting check is the only kind that can safely be required, and the job is
# a single unit-test class (see below), so running it on every PR costs little. Do NOT re-add a `paths:` filter
# here without first dropping the required-check rule on master.
on:
  pull_request:
    branches: [ master ]
  workflow_dispatch: # allows manual trigger

jobs:
  analyze:
    name: Translation Bundle Analysis
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      # No submodules needed: AppMessageCoverageTest is a plain unit test under -Dtests, and the shared lint
      # configs in code-quality-config are only read by the -Dlint/-Dall profiles this deliberately does not run.
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      - name: Setup Maven Action
        uses: s4u/setup-maven-action@v1.21.0
        with:
          checkout-fetch-depth: 0
          java-distribution: 'temurin'
          java-version: '26'
          maven-version: '3.9.16'

      # Not routed through lint_and_tests.sh: its `java` step is the full ~10-minute -Dall gate plus the E2E,
      # smoke and perf tiers, and there is no scoped step for a single unit-test class (see CLAUDE.md's
      # "Commands"). -Dcss.build.skip=true drops the POM's css-build exec, which would otherwise pull in Node
      # and the frontend/ npm install for a test that never renders a page.
      - name: Check message bundles with AppMessageCoverageTest
        run: mvn test -Dtests -Dtest=AppMessageCoverageTest -Dcss.build.skip=true
