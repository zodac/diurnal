networks:
  diurnal-network:
    name: diurnal-network
    driver: bridge

services:

  diurnal:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: diurnal
    hostname: diurnal
    cap_drop:
      - ALL
    depends_on:
      diurnal-db:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: "2G"
          pids: "256"
    memswap_limit: "2G"
    env_file:
      - .env
    environment:
      # Database configuration
      DB_HOST: "diurnal-db"
      DB_PORT: "5432"
      DB_NAME: "diurnal_db"
      DB_USER: "diurnal_user"
      DB_PASSWORD: "change-me-strong-password"
      # Application configuration
      DB_LOG_LEVEL: "WARN"
      EXPORT_CSV_BOM: "false"
      LOG_LEVEL: "DEBUG"
      MAX_UPLOAD_SIZE: "100M"
      NOTE_ENCRYPTION_KEY: "${NOTE_ENCRYPTION_KEY:?NOTE_ENCRYPTION_KEY must be set}"  # Generate using `openssl rand -base64 32`
      NOTE_ENCRYPTION_PREVIOUS_KEYS: ""
      NOTE_MAX_LENGTH: "10000"
      TZ: "Pacific/Auckland"
      # Authentication config
      ENABLE_REGISTRATION: "true"
      OIDC_ENABLED: "true"
      OIDC_ISSUER_URL: "https://auth.${DOMAIN_NAME}"
      OIDC_CLIENT_ID: "${OIDC_CLIENT_ID:-diurnal}"
      OIDC_CLIENT_SECRET: "${OIDC_CLIENT_SECRET:-}"
      OIDC_PROVIDER_NAME: "Authelia"
      OIDC_AUTO_REDIRECT: "false"
      OIDC_VERIFY_ON_STARTUP: "true"
      OIDC_ADMIN_GROUP: "diurnal_admins"
      OIDC_USER_GROUP: "diurnal_users"
      OIDC_LOGOUT_URL: ""
      PASSWORD_AUTH_ENABLED: "true"
      SESSION_IDLE_TIMEOUT: "P30D"
      SESSION_ABSOLUTE_LIFETIME: "P90D"
      TRUST_X_FORWARDED_HEADERS: "true"
    labels:
      # Reverse proxy config
      traefik.enable: "true"
      traefik.http.routers.diurnal.rule: "Host(`diurnal.${DOMAIN_NAME}`)"
      traefik.http.routers.diurnal.entrypoints: "websecure"
      traefik.http.routers.diurnal.tls: "true"
      traefik.http.routers.diurnal.middlewares: "no-forward-auth@file"
      traefik.http.services.diurnal.loadbalancer.server.port: "8080"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - diurnal-network
    ports:
      - "8080:8080"
    restart: unless-stopped
    security_opt:
      - no-new-privileges=true
    tmpfs:
      - /tmp:size=64m,noexec,nosuid,nodev
    user: "65532:65532"  # nonroot user

  diurnal-db:
    image: postgres:18.6-alpine
    container_name: diurnal-db
    hostname: diurnal-db
    command:
      - -ccheckpoint_timeout=15min
      - -ceffective_cache_size=768MB
      - -cjit=off
      - -cmaintenance_work_mem=128MB
      - -cmax_connections=25
      - -cmax_wal_size=2GB
      - -cmin_wal_size=256MB
      - -crandom_page_cost=1.1
      - -cshared_buffers=256MB
      - -cwal_compression=lz4
      - -cwork_mem=8MB
    environment:
      PGDATA: /var/lib/postgresql/data/pgdata
      POSTGRES_DB: "diurnal_db"
      POSTGRES_PASSWORD: "change-me-strong-password"
      POSTGRES_USER: "diurnal_user"
      TZ: "Pacific/Auckland"
    expose:
      - "5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U diurnal_user -d diurnal_db" ]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 5s
      start_interval: 5s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - diurnal-network
    restart: unless-stopped
    security_opt:
      - no-new-privileges=true
    tmpfs:
      - /tmp:size=64m,noexec,nosuid,nodev
      - /var/run/postgresql:uid=999,gid=999,mode=775  # Giving access to startup root execution
    user: "999:999"  # postgres user
    volumes:
      - diurnal-db_data:/var/lib/postgresql/

volumes:
  diurnal-db_data:
    name: diurnal-db_data
