# Single local database for development and testing. One container, one database ("diurnal_db"),
# shared by dev mode and tests. Storage is tmpfs so data is wiped on every recreate.
#
#   diurnal-db-dev — ephemeral (tmpfs), port 5432, DB "diurnal_db". Start it for `mvn quarkus:dev`:
#            docker compose -p diurnal-dev -f docker-compose.dev.yml up -d diurnal-db-dev
#
# ALWAYS pass `-p diurnal-dev`. There is deliberately NO `container_name` here: a fixed one is global to
# the Docker daemon, so every caller managed the SAME container and `rm -sf` removed it out from under
# whoever else was using it - a second build, or a developer's `quarkus:dev` session. The project name
# gives each caller the same container without that being a property of the daemon's global namespace,
# which is exactly what tests/docker-compose.smoke.yml and docker-compose.perf.yml already do.
#        The `-Dall` Maven profile starts/removes it automatically around the IT test-suite.
services:
  diurnal-db-dev:
    image: postgres:18.6-alpine
    hostname: diurnal-db-dev
    environment:
      POSTGRES_DB: diurnal_db
      POSTGRES_USER: diurnal_user
      POSTGRES_PASSWORD: diurnal_password
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "5432:5432"
    tmpfs:
      - /var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U diurnal_user -d diurnal_db"]
      interval: 5s
      timeout: 3s
      retries: 5
