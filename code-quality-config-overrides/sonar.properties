# SonarQube analysis properties for this project, layered on top of the parent-pom's sonar.* settings.
#
# NOT found by convention. The SonarScanner for Maven - which is how this project analyses (the
# sonar-maven-plugin bound to `install`, activated by `-Dsonarqube`) - reads only Maven properties and
# deliberately ignores a `sonar-project.properties`. lint_and_tests.sh therefore reads this file and
# passes every entry as a `-D` to the same `mvn` invocation, so a scan run by hand must do the same.
#
# Format: one `key=value` per line, `#` comments and blank lines ignored. Values are passed verbatim and
# are never glob-expanded or word-split, so a `**/*.java` pattern is safe unquoted.

# ---------------------------------------------------------------------------------------------------
# java:S3252 - "static base class members should not be accessed via derived types"
# ---------------------------------------------------------------------------------------------------
# A FALSE POSITIVE on every one of the 87 call sites it reports here, and its suggested fix BREAKS THE
# APPLICATION. All 87 are Quarkus Panache active-record statics called on an entity (Action.count(...),
# User.findById(...), Note.list(...)); an audit of every inherited-static access in main + test found no
# non-Panache instance, so there is nothing in this repo the rule legitimately applies to.
#
# The statics only exist on the entity. `PanacheEntityBase.count(...)` and its siblings are stubs whose
# entire body is `throw AbstractJpaOperations.implementationInjectionMissing()`; Quarkus generates the
# real implementations onto each @Entity subclass at build time (52 of them on Action). Java HIDES rather
# than overrides statics, so `invokestatic` binds to the type written at the call site - move the call to
# the supertype, as Sonar advises, and it binds to the throwing stub and fails at runtime with
# "This method is normally automatically overridden in subclasses: did you forget to annotate your entity
# with @Entity?".
#
# This has already broken the app once: the dashboard calendar's event feed silently returned nothing
# after Action.mapByUser was changed to PanacheEntityBase.<Action>list(...), caught only by the
# deployment-smoke tier. IntelliJ's identical inspection (StaticCallOnSubclass) is switched off in
# code-quality-config/java/qodana/profiles/java.yaml for the same reason, and the rule is written up in
# .claude/CODE_STYLE.md ("Panache statics are called on the entity, NEVER on PanacheEntityBase").
#
# The resourceKey is this project's own package and so covers effectively all of its Java - the 87 call
# sites sit in 39 files spread across nearly every package, which leaves no narrower pattern worth
# maintaining. It is written as the package rather than `**/*.java` to keep the exclusion off anything
# outside it (generated sources on the analysis path, say), NOT because it distinguishes Panache call
# sites from other code: a genuine S3252 in this project would go unreported. That trade is accepted for
# the same reason the Qodana profile switches StaticCallOnSubclass off outright - the audit found no
# non-Panache instance to lose, and CODE_STYLE.md carries the rule for the case the linter no longer can.
sonar.issue.ignore.multicriteria=panacheStatics
sonar.issue.ignore.multicriteria.panacheStatics.ruleKey=java:S3252
sonar.issue.ignore.multicriteria.panacheStatics.resourceKey=**/net/zodac/diurnal/**/*.java
