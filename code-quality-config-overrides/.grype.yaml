# Project-level grype configuration, layered over code-quality-config/docker/.grype.yaml This file is passed FIRST, so its
# scalars win and its ignores are appended to the shared list. lint_and_tests.sh points grype at it with `-c`; it is not at
# the repo root, so grype does not pick it up by convention.
ignore:
  # Everything below is a glibc (libc6) CVE in the Debian 13 (trixie) base image. There is no newer libc6 to upgrade to.
  # Debian's security team marks them as "unimportant", so no package update will ever clear them, and all are Negligible severity.
  - vulnerability: CVE-2010-4756
    package:
      name: libc6
      type: deb
    reason: "glibc glob() DoS; Debian no-DSA (unimportant), Negligible, pattern source not attacker-controlled"
  - vulnerability: CVE-2018-20796
    package:
      name: libc6
      type: deb
    reason: "glibc regex stack-exhaustion; Debian no-DSA (unimportant), Negligible, not reachable"
  - vulnerability: CVE-2019-9192
    package:
      name: libc6
      type: deb
    reason: "glibc regex uninitialised read (disputed upstream); Debian no-DSA (unimportant), Negligible"
  - vulnerability: CVE-2019-1010022
    package:
      name: libc6
      type: deb
    reason: "glibc stack-guard bypass (disputed upstream); Debian no-DSA (unimportant), Negligible"
  - vulnerability: CVE-2019-1010023
    package:
      name: libc6
      type: deb
    reason: "glibc ld.so PT_LOAD (disputed upstream); Debian no-DSA (unimportant), Negligible"
  - vulnerability: CVE-2019-1010024
    package:
      name: libc6
      type: deb
    reason: "glibc ASLR bypass (disputed upstream); Debian no-DSA (unimportant), Negligible"
  - vulnerability: CVE-2019-1010025
    package:
      name: libc6
      type: deb
    reason: "glibc ASLR/heap guard (disputed upstream); Debian no-DSA (unimportant), Negligible"

  # ── TEMPORARY - REMOVE AS SOON AS THE BASE IMAGE IS REBUILT ──────────────────────────────────────────────────────────
  # These two are NOT like the entries above. Every entry above is a Negligible, Debian-"unimportant" CVE that no package
  # update will ever clear, so it is suppressed permanently. These two are Critical and High, and a fix EXISTS: Debian
  # shipped libc6 2.41-12+deb13u4. The runtime base (gcr.io/distroless/base-nossl-debian13:nonroot) has simply not been
  # rebuilt against it yet - `docker pull` of that tag still returns an image carrying 2.41-12+deb13u3 - so there is
  # nothing to upgrade TO, and without these the gate blocks every commit on master on Google's rebuild schedule.
  #
  # DELETE BOTH ENTRIES the moment the base ships deb13u4 or later. To check:
  #     docker pull gcr.io/distroless/base-nossl-debian13:nonroot
  #     .github/scripts/lint_and_tests.sh docker:grype
  # A scan that is green with these two removed is the signal; leaving them in place after that silently suppresses a
  # Critical in the production image, which is exactly what this file's other entries are careful NOT to do.
  - vulnerability: CVE-2026-5450
    package:
      name: libc6
      type: deb
    reason: "TEMPORARY: Critical, FIXED IN libc6 2.41-12+deb13u4; awaiting a distroless base rebuild. Remove when it lands"
  - vulnerability: CVE-2026-5928
    package:
      name: libc6
      type: deb
    reason: "TEMPORARY: High, FIXED IN libc6 2.41-12+deb13u4; awaiting a distroless base rebuild. Remove when it lands"
